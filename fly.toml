# Fly.io კონფიგი — backend API hosting
# ცხოვრობს: https://<app-name>.fly.dev
# გაუშვი: flyctl launch (პირველად) ან flyctl deploy (განახლება)

app = "cars-api"                                # შეცვალე უნიკალურად — `flyctl apps list`-ი გაჩვენებს თავისუფლებას
primary_region = "fra"                          # Frankfurt — საქართველოს ახლოს

[build]

[env]
  PRODUCTION = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"                   # ცარიელი ფურცელი → stop, ფასი მცირდება
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256                               # 256MB საკმარისია FastAPI-სთვის
