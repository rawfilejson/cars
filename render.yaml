# render.com deploy config
# connect your repo to render, it reads this file automatically.

services:
  - type: web
    name: cars-api
    runtime: docker
    plan: free                  # change to "starter" to remove cold starts
    region: frankfurt           # closest to Georgia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PRODUCTION
        value: "1"
      # rate limit: a 10s cooldown only, hourly limit off (0), and a high IP
      # ceiling aimed purely at scrapers.
      - key: SEARCH_COOLDOWN_SECONDS
        value: "10"
      - key: SEARCH_LIMIT_PER_HOUR
        value: "0"
      - key: SEARCH_LIMIT_PER_IP_HOUR
        value: "3000"
      # secrets 
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
