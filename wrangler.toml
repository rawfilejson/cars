# cloudflare workers config. serves the static frontend in web/ through worker.js,
# which also uses a cron trigger to keep the render backend awake (see worker.js).
# docs: https://developers.cloudflare.com/workers/static-assets/

name = "cars"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["*/10 * * * *"]
