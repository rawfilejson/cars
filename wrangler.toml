# Cloudflare Workers config — სტატიკურ frontend-ს (web/) ემსახურება worker.js-ით,
# რომელიც cron trigger-ით Render backend-ს ცოცხალს ინახავს (იხ. worker.js).
# Docs: https://developers.cloudflare.com/workers/static-assets/

name = "cars"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = ["*/10 * * * *"]
