[project]
name = "cars"
version = "0.2.0"
description = "ქართული მანქანების მონაცემთა ბაზა — autopapa.ge / myauto.ge პარსერი"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.59.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.3.1",
    "python-dotenv>=1.0.1",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "orjson>=3.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
