# Photo backfill — დაგროვილი image_urls → R2, მომხმარებლის PC-ს გარეშე.
# წყაროს CDN → runner → R2, ლოკალური ასლი მაშინვე იშლება (--purge-local).
#
# Auto-chaining: schedule ყოველ 6სთ აგრძელებს backlog-ს (sync_photos მხოლოდ
# pending-ს ირჩევს, ამიტომ resumable-ია). როცა backlog გასუფთავდება (pending=0),
# run თვითონ თიშავს ამ schedule-ს (gh workflow disable). PAT არ სჭირდება.
#
# საჭირო Secrets: DATABASE_URL, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_URL

name: Photo Backfill

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      concurrent:
        description: 'ერთდროული ფოტო-I/O'
        required: false
        default: '16'
      limit:
        description: 'მაქს. მანქანა (ცარიელი = ყველა pending)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: photo-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Backfill photos to R2 (purge local)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          CONCURRENT: ${{ github.event.inputs.concurrent }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS="--purge-local --concurrent ${CONCURRENT:-16}"
          if [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          echo "Running: sync_photos $ARGS"
          uv run python -m src.scripts.sync_photos $ARGS

      - name: Stop auto-chaining when backlog is clear
        if: ${{ github.event_name == 'schedule' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PENDING=$(uv run python -c "import psycopg; from src.common.config import DATABASE_URL; c=psycopg.connect(DATABASE_URL); cur=c.cursor(); cur.execute('SELECT COUNT(*) FROM cars WHERE image_urls IS NOT NULL AND array_length(image_urls,1)>0 AND (image_keys IS NULL OR array_length(image_keys,1) IS NULL)'); print(cur.fetchone()[0])")
          echo "Pending cars: $PENDING"
          if [ "$PENDING" = "0" ]; then
            echo "Backlog clear — disabling the schedule."
            gh workflow disable "Photo Backfill" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Backfill failed at $(date -u)" >&2
          echo "::error::Photo backfill run failed — check logs"
