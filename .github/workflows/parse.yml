# =====================================================================
# Scheduled parser — GitHub Actions
# =====================================================================
# დღეში 2-ჯერ რანდომულ დროს ვუშვებთ პარსერს + ფოტოების sync-ს.
#
# cron timing-ი ფიქსირებულია (GitHub-ის ლიმიტი), მაგრამ ჯერ ვაჩერებთ
# რანდომულ წუთებზე (0-59 წთ.) რომ ბოტ-სიგნალი ნაკლები იყოს.
#
# Secrets რომ უნდა შექმნა GitHub repo-ში:
#   Settings → Secrets and variables → Actions → New repository secret
#     DATABASE_URL
#     R2_ACCOUNT_ID
#     R2_ACCESS_KEY_ID
#     R2_SECRET_ACCESS_KEY
#     R2_BUCKET
#     R2_PUBLIC_URL
# =====================================================================

name: Scheduled Parser

on:
  # დღეში 2-ჯერ; ქვემოთ random delay (0-60წთ) ზუსტ დროს არანდომებს.
  schedule:
    - cron: '0 3 * * *'        # ~07:00 თბილისი (+ random delay)
    - cron: '0 15 * * *'       # ~19:00 თბილისი (+ random delay)
  workflow_dispatch:           # ხელითაც

# parallel-ად ერთდროულად ერთი job-ი მუშაობდეს
concurrency:
  group: parser
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Random delay (0-60 min) — anti-pattern detection
        if: ${{ github.event_name == 'schedule' }}
        run: |
          DELAY=$((RANDOM % 3600))
          echo "Sleeping for $DELAY seconds (random)..."
          sleep $DELAY

      - name: Run AutoPapa parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          CONCURRENT_PAGES: '10'
        run: uv run python -m src.parsers.autopapa

      - name: Run MyAuto parser (API-fast)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONCURRENT_PAGES: '10'
        run: uv run python -m src.parsers.myauto

      - name: Sync photos to R2
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: uv run python -m src.scripts.sync_photos --concurrent 8

      - name: Notify on failure
        if: failure()
        run: |
          echo "Parser failed at $(date -u)" >&2
          echo "::error::Parser run failed — check logs"
