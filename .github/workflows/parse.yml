# =====================================================================
# Scheduled parser — GitHub Actions
# =====================================================================
# დღეში 2-ჯერ რანდომულ დროს ვუშვებთ პარსერს + ფოტოების sync-ს.
#
# cron timing-ი ფიქსირებულია (GitHub-ის ლიმიტი), მაგრამ ჯერ ვაჩერებთ
# რანდომულ წუთებზე (0-59 წთ.) რომ ბოტ-სიგნალი ნაკლები იყოს.
#
# Secrets რომ უნდა შექმნა GitHub repo-ში:
#   Settings → Secrets and variables → Actions → New repository secret
#     DATABASE_URL
#     R2_ACCOUNT_ID
#     R2_ACCESS_KEY_ID
#     R2_SECRET_ACCESS_KEY
#     R2_BUCKET
#     R2_PUBLIC_URL
# =====================================================================

name: Scheduled Parser

on:
  schedule:
    # UTC დრო. საქართველო = UTC+4. ანუ:
    #   03:00 UTC = 07:00 თბ.
    #   15:00 UTC = 19:00 თბ.
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:                       # ხელით გაშვების შესაძლებლობა

# parallel-ად ერთდროულად ერთი job-ი მუშაობდეს
concurrency:
  group: parser
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Random delay (0-60 min) — anti-pattern detection
        run: |
          DELAY=$((RANDOM % 3600))
          echo "Sleeping for $DELAY seconds (random)..."
          sleep $DELAY

      - name: Run AutoPapa parser
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          CONCURRENT_PAGES: '10'
        run: uv run python -m src.parsers.autopapa

      - name: Sync photos to R2
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: uv run python -m src.scripts.sync_photos --concurrent 5

      - name: Notify on failure
        if: failure()
        run: |
          echo "Parser failed at $(date -u)" >&2
          echo "::error::Parser run failed — check logs"
