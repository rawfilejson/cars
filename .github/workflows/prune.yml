# =====================================================================
# Dead-listing prune
# =====================================================================
# Once a day, check the listings we haven't seen for the longest time against
# the source, and delete only the ones the source confirms are gone.
# The script logs a dry run first, then applies.
# =====================================================================

name: Prune Dead Listings

on:
  schedule:
    - cron: '30 9 * * *'        # ~13:30 Tbilisi
  workflow_dispatch:            # and by hand

concurrency:
  group: prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Verify and prune dead listings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/prune_dead.py --apply --days 30 --limit 800
