# Photo Backfill Blitz: a one-off parallel clear-out of the backlog.
# Three runners at once, each taking the ids where id %% 3 == shard, so no overlap.
# Start it by hand: Actions > Photo Backfill Blitz > Run workflow.
#
# Warning: this burns a lot of Actions minutes (roughly 3x the timeout). Use it to
# clear a backlog once; for steady, gentler backfill use sync_backfill.yml instead.
#
# Required secrets: DATABASE_URL, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_URL

name: Photo Backfill Blitz

on:
  workflow_dispatch:
    inputs:
      concurrent:
        description: 'concurrent photo I/O per shard'
        required: false
        default: '16'

permissions:
  contents: read

concurrency:
  group: photo-blitz
  cancel-in-progress: false

jobs:
  blitz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Backfill shard ${{ matrix.shard }}/3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          CONCURRENT: ${{ github.event.inputs.concurrent }}
        run: |
          uv run python -m src.scripts.sync_photos \
            --purge-local --shard ${{ matrix.shard }}/3 --concurrent ${CONCURRENT:-16}
