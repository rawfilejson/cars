services:
  postgres:
    image: postgres:16-alpine
    container_name: cars_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cars
      POSTGRES_PASSWORD: cars
      POSTGRES_DB: cars
    ports:
      - "5432:5432"
    volumes:
      - cars_pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  cars_pg_data:
