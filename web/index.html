        .carousel { position: relative; background: #1A1A1A; overflow: hidden; aspect-ratio: 4 / 3; cursor: zoom-in; }
        .carousel-stage { position: absolute; inset: 0; }
        .carousel-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .carousel-stage iframe { width: 100%; height: 100%; border: 0; display: block; cursor: default; }
        .carousel-counter {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(26,26,26,0.75); color: #FAF7F2;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            padding: 2px 8px; border-radius: 3px;
            letter-spacing: 0.05em;
            pointer-events: none;
        }


        .thumb-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; }
        .thumb {
            aspect-ratio: 4 / 3; overflow: hidden; background: #F2EDE3;
            border: 2px solid transparent; padding: 0; cursor: pointer;
            transition: border-color 100ms, opacity 100ms; opacity: 0.85;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb:hover { opacity: 1; }
        .thumb.is-active { border-color: #1A1A1A; opacity: 1; }
        .thumb.is-video {
            position: relative;
        }
        .thumb.is-video::after {
            content: "▶"; position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #FAF7F2; font-size: 16px;
            background: rgba(26,26,26,0.4); pointer-events: none;
        }


        .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(15,12,8,0.96); display: flex; flex-direction: column; padding: 16px; }
        .lightbox.hidden { display: none; }
        .lightbox-stage {
            flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .lightbox-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .lightbox-stage iframe { width: min(90vw, 1280px); height: min(80vh, 720px); border: 0; }
        .lightbox-prev, .lightbox-next {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(250,247,242,0.08); color: #FAF7F2;
            width: 56px; height: 56px; border: 0; cursor: pointer;
            font-size: 22px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background 100ms;
        }
        .lightbox-prev:hover, .lightbox-next:hover, .lightbox-prev:active, .lightbox-next:active { background: rgba(250,247,242,0.22); }
        .lightbox-prev { left: 8px; }
        .lightbox-next { right: 8px; }
        .lightbox-close {
            position: absolute; top: 12px; right: 12px;
            background: rgba(250,247,242,0.18); color: #FAF7F2;
            width: 48px; height: 48px; border: 0; cursor: pointer;
            font-size: 22px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background 100ms;
            z-index: 3;
        }
        .lightbox-close:hover, .lightbox-close:active { background: rgba(250,247,242,0.35); }
        .lightbox-counter {
            position: absolute; top: 20px; left: 20px;
            color: #FAF7F2; font-family: 'JetBrains Mono', monospace; font-size: 13px;
            letter-spacing: 0.06em;
        }
        .lightbox-thumbs {
            display: flex; gap: 6px; padding-top: 12px; justify-content: center;
            overflow-x: auto; flex-shrink: 0;
            scrollbar-width: thin; scrollbar-color: #555 transparent;
        }
        .lightbox-thumb {
            width: 64px; height: 48px; flex-shrink: 0;
            overflow: hidden; cursor: pointer;
            border: 2px solid transparent; opacity: 0.55;
            transition: opacity 100ms, border-color 100ms;
            background: #1A1A1A; padding: 0;
        }
        @media (min-width: 640px) { .lightbox-thumb { width: 84px; height: 63px; } }
        .lightbox-thumb:hover { opacity: 0.9; }
        .lightbox-thumb.is-active { border-color: #C2410C; opacity: 1; }
        .lightbox-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }


        .desc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .desc-translate {
            background: none; border: 0; padding: 0; cursor: pointer;

        .see-more {

        .meta-line { color: #6B6258; font-size: 12px; font-style: italic; }


        .meta-note { color: #6B6258; font-size: 12px; }


        .phone-list { display: flex; flex-direction: column; gap: 4px; }

        .phone-list a:hover { color: #C2410C; }


        .card-title-link { color: inherit; text-decoration: none; }
        .card-title-link:hover { color: #C2410C; }


        .detail-bar {
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .detail-btn {
            background: transparent; border: 1px solid #E5DFD3; color: #6B6258;
            padding: 8px 14px; font-size: 13px; cursor: pointer;
            font-family: inherit; text-decoration: none;
            transition: color 100ms, border-color 100ms;
        }
        .detail-btn:hover { color: #C2410C; border-color: #C2410C; }
        .detail-btn.is-copied { color: #15803D; border-color: #15803D; }

        .detail-title { font-size: 32px; line-height: 1.1; }
        @media (min-width: 640px) { .detail-title { font-size: 40px; } }


        .gallery {
            display: grid; gap: 8px; grid-template-columns: 1fr;
            margin: 24px 0;
        }
        @media (min-width: 640px) { .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
        @media (min-width: 900px) { .gallery { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
        .gallery-tile {
            aspect-ratio: 4/3; overflow: hidden; cursor: pointer;
            background: #1A1A1A; border: 0; padding: 0;
        }
        .gallery-tile img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform 200ms;
        }
        .gallery-tile:hover img { transform: scale(1.03); }
        .gallery-tile.is-video {
            position: relative;
        }
        .gallery-tile.is-video::after {
            content: '▶'; position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #FAF7F2; font-size: 32px;
            background: rgba(0,0,0,0.25); pointer-events: none;
        }
        /* product polish — elevation, motion, quick chips */
        #search-section .card { box-shadow: 0 6px 28px rgba(26,26,26,.06); }
        #results .card { animation: cardIn .42s cubic-bezier(.2,.7,.2,1) both; }
        #results .card:hover { box-shadow: 0 12px 34px rgba(26,26,26,.12); transform: translateY(-3px); }
        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        .hero-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 20px; align-items: baseline; }
        .hero-stat { display: inline-flex; align-items: baseline; gap: 7px; color: #6B6258; font-size: 14px; }
        .hero-stat b { font-family: 'JetBrains Mono', monospace; font-size: 19px; color: #1A1A1A; font-weight: 600; }
        .hero-stat .dot { color: #15803D; font-size: 11px; transform: translateY(-1px); }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
        .chip {
            border: 1px solid #E5DFD3; background: #fff; color: #1A1A1A; border-radius: 999px;
            padding: 7px 15px; font-size: 14px; cursor: pointer; white-space: nowrap;
            transition: border-color .14s, transform .14s, background .14s, color .14s;
        }
        .chip:hover { border-color: #1A1A1A; transform: translateY(-1px); }
        .chip:active { transform: translateY(0); }
        .chip.is-accent { background: #1A1A1A; color: #FAF7F2; border-color: #1A1A1A; }
        .chip.is-accent:hover { background: #C2410C; border-color: #C2410C; }

        /* search -> results: hero collapses so results lead */
        body.mode-results #hero-desc { display: none; }

        /* skeleton loading cards (shimmer) */
        .skeleton-card { display: flex; overflow: hidden; border: 1px solid #E5DFD3; border-radius: 14px; background: #fff; margin-bottom: 16px; }
        .sk { position: relative; overflow: hidden; background: #ECE6DA; border-radius: 8px; }
        .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation: shimmer 1.25s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .sk-img { width: 38%; min-height: 160px; }
        .sk-body { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 13px; }
        .sk-line { height: 14px; }
        @media (max-width: 767px) { .skeleton-card { flex-direction: column; } .sk-img { width: 100%; min-height: 190px; } }

        @media (prefers-reduced-motion: reduce) {
            #results .card, .chip, #hero-section { animation: none !important; transition: none !important; }
            #results .card:hover { transform: none; }
            .sk::after { animation: none; }
        }

        /* refined benefit pills (replace the green dots) */
        .hero-pill { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #C2410C; background: #FEE7D6; border-radius: 999px; padding: 5px 12px; font-weight: 500; }

        /* clear-X inside the search bar */
        .clear-x { color: #B0A795; font-size: 17px; line-height: 1; padding: 0 10px; background: transparent; border: 0; cursor: pointer; transition: color .12s; align-self: center; }
        .clear-x:hover { color: #1A1A1A; }

        /* save (heart) button */
        .save-btn { background: transparent; border: 1px solid #E5DFD3; border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; color: #B0A795; transition: all .15s ease; flex-shrink: 0; }
        .save-btn:hover { border-color: #C2410C; color: #C2410C; transform: scale(1.08); }
        .save-btn.is-saved { color: #C2410C; border-color: #C2410C; background: #FEE7D6; }

        /* header Saved trigger */
        .saved-trigger { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #6B6258; border: 1px solid #E5DFD3; border-radius: 999px; padding: 5px 12px; cursor: pointer; transition: all .14s; }
        .saved-trigger:hover { border-color: #1A1A1A; color: #1A1A1A; }
        .saved-trigger .cnt { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #C2410C; }

        /* slide-in drawer */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(26,26,26,.4); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
        .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 390px; max-width: 92vw; background: #FAF7F2; box-shadow: -8px 0 44px rgba(26,26,26,.2); transform: translateX(100%); transition: transform .32s cubic-bezier(.2,.7,.2,1); z-index: 61; display: flex; flex-direction: column; }
        .drawer.open { transform: none; }
        .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid #E5DFD3; }
        .drawer-head h3 { font-family: 'Fraunces','Noto Serif Georgian',serif; font-size: 22px; color: #1A1A1A; }
        .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px 32px; }
        .drawer-sec { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 10px; }
        .drawer-sec:first-child { margin-top: 0; }
        .drawer-sec-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6B6258; }
        .saved-row { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid #EFEADF; }
        .saved-row .grow { cursor: pointer; min-width: 0; flex: 1; }
        .saved-row:hover .saved-row-title { color: #C2410C; }
        .saved-row img { width: 58px; height: 44px; object-fit: cover; border-radius: 6px; background: #ECE6DA; flex-shrink: 0; }
        .saved-row-title { font-size: 14px; color: #1A1A1A; line-height: 1.3; }
        .saved-row-price { font-family: 'JetBrains Mono',monospace; font-size: 12px; color: #15803D; margin-top: 2px; }
        .row-x { color: #B0A795; border: 0; background: transparent; cursor: pointer; font-size: 14px; padding: 4px 2px; }

        .hist-chip { display: inline-block; margin: 0 6px 6px 0; padding: 6px 12px; border: 1px solid #E5DFD3; border-radius: 999px; font-size: 13px; color: #1A1A1A; background: #fff; cursor: pointer; }
        .hist-chip:hover { border-color: #1A1A1A; }

        .chip-wrap { display: inline-flex; align-items: stretch; margin: 0 6px 6px 0; }

        .chip-del { display: flex; align-items: center; border: 1px solid #E5DFD3; border-left: 0; background: #fff; color: #B0A795; border-radius: 0 999px 999px 0; padding: 0 10px; font-size: 11px; cursor: pointer; }
        /* მთელი chip ერთად რეაგირებს hover-ზე — ნახევრად outline აღარ ჩანს */
        .chip-wrap:hover .hist-chip, .chip-wrap:hover .chip-del { border-color: #1A1A1A; }
        .chip-wrap:hover .chip-del { color: #C2410C; }
    </style>
</head>

<script>
    const API_BASE = window.API_BASE || 'http://127.0.0.1:8765';

    const CLIENT_ID = (() => {
        try {
            let id = localStorage.getItem('cdb_cid');
            if (!id || !/^[A-Za-z0-9_-]{8,64}$/.test(id)) {
                const raw = (crypto.randomUUID && crypto.randomUUID())
                    || (Date.now().toString(36) + Math.random().toString(36).slice(2));
                id = raw.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
                localStorage.setItem('cdb_cid', id);
            }
            return id;
        } catch (_) {
            return '';
        }
    })();

    let lastResponse = null;
    let currentPage = 1;
    const _searchCache = new Map();
    const _SEARCH_TTL = 300000;

    async function loadStats() {
        try {
            const resp = await fetch(`${API_BASE}/stats`);
            if (!resp.ok) return;
            const data = await resp.json();
            const n = data.total_cars.toLocaleString();
            document.getElementById('nav-listings-count').textContent = t('nav_listings_count', { n });
            document.getElementById('count-pill').classList.remove('hidden');
        } catch (_) {  }
    }

    document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.onclick = () => setLang(btn.dataset.lang);
    });

    document.addEventListener('langchange', () => {
        loadStats();
        if (parseRoute().view === 'detail' && _detailCar) {
            renderDetail(_detailCar);
            return;
        }
        if (lastResponse) renderResults(lastResponse);
    });

    const _FILTER_FIELDS = {
        'year-from':    'year_from',
        'year-to':      'year_to',
        'price-from':   'price_from',
        'price-to':     'price_to',
        'mileage-from': 'mileage_from',
        'mileage-to':   'mileage_to',
    };

    function buildSearchPayload() {
        const payload = { page: currentPage };
        const q = document.getElementById('search-input').value.trim();
        if (q) payload.query = q;

        for (const [id, key] of Object.entries(_FILTER_FIELDS)) {
            const raw = document.getElementById('f-' + id).value;
            const n = parseInt(raw, 10);
            if (!Number.isNaN(n) && n >= 0) payload[key] = n;
        }

        const sort = document.getElementById('f-sort').value;
        if (sort) payload.sort = sort;

        return payload;
    }

    (function populateYears() {
        const now = new Date().getFullYear();
        const yFrom = document.getElementById('f-year-from');
        const yTo   = document.getElementById('f-year-to');
        const opts = ['<option value=""></option>'];
        for (let y = now; y >= 1900; y--) {
            opts.push(`<option value="${y}">${y}</option>`);
        }
        const html = opts.join('');
        yFrom.innerHTML = html;
        yTo.innerHTML = html;
        // არასწორი დიაპაზონის თავიდან აცილება — "დან" ყოველთვის <= "მდე"
        const fixRange = (changed) => {
            const f = parseInt(yFrom.value, 10), t = parseInt(yTo.value, 10);
            if (f && t && f > t) (changed === 'from' ? yTo : yFrom).value = (changed === 'from' ? yFrom : yTo).value;
        };
        yFrom.addEventListener('change', () => fixRange('from'));
        yTo.addEventListener('change', () => fixRange('to'));
    })();

    // ფასი/გარბენი — "დან" არ უნდა აღემატებოდეს "მდე"-ს; თუ აღემატება, ვცვლით ადგილებს
    (function wireNumRanges() {
        const swap = (from, to) => {
            const f = parseFloat(from.value), t = parseFloat(to.value);
            if (!Number.isNaN(f) && !Number.isNaN(t) && f > t) {
                const tmp = from.value; from.value = to.value; to.value = tmp;
            }
        };
        for (const [a, b] of [['f-price-from', 'f-price-to'], ['f-mileage-from', 'f-mileage-to']]) {
            const from = document.getElementById(a), to = document.getElementById(b);
            from.addEventListener('change', () => swap(from, to));
            to.addEventListener('change', () => swap(from, to));
        }
    })();

    window.clearFilters = function () {
        for (const id of Object.keys(_FILTER_FIELDS)) {
            document.getElementById('f-' + id).value = '';
        }
        document.getElementById('f-sort').value = '';
        const brand = document.getElementById('f-brand');
        const model = document.getElementById('f-model');
        brand.value = '';
        model.value = '';
        model.innerHTML = `<option value="">${t('model_any')}</option>`;
        model.disabled = true;
        updateFilterResets();
    };

    const _RESET_GROUPS = {
        brand:   ['f-brand'],
        model:   ['f-model'],
        year:    ['f-year-from', 'f-year-to'],
        price:   ['f-price-from', 'f-price-to'],
        mileage: ['f-mileage-from', 'f-mileage-to'],
    };

    // თითო ფილტრს ცალკე ასუფთავებს და თავიდან ეძებს
    window.resetFilter = function (kind) {
        if (kind === 'brand') {
            document.getElementById('f-brand').value = '';
            const model = document.getElementById('f-model');
            model.value = '';
            model.innerHTML = `<option value="">${t('model_any')}</option>`;
            model.disabled = true;
        } else {
            (_RESET_GROUPS[kind] || []).forEach((id) => {
                document.getElementById(id).value = '';
            });
        }
        updateFilterResets();
        if (lastResponse) doSearch();
    };

    function updateFilterResets() {
        for (const [kind, ids] of Object.entries(_RESET_GROUPS)) {
            const group = document.querySelector(`[data-filter="${kind}"]`);
            if (!group) continue;
            const hasVal = ids.some((id) => {
                const el = document.getElementById(id);
                return el && el.value;
            });
            group.classList.toggle('has-val', hasVal);
        }
    }

    let _makes = {};

    async function loadMakes() {
        try {
            const resp = await fetch(`${API_BASE}/makes`);
            if (!resp.ok) return;
            _makes = (await resp.json()).makes || {};
        } catch { return; }
        document.getElementById('f-brand').insertAdjacentHTML('beforeend',
            Object.keys(_makes).map(n =>
                `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join(''));
    }

    function onBrandChange() {
        const brand = document.getElementById('f-brand').value;
        const model = document.getElementById('f-model');
        const models = _makes[brand] || [];
        model.innerHTML = `<option value="">${t('model_any')}</option>` +
            models.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
        model.disabled = !brand;
        runBrandSearch();
    }

    function runBrandSearch() {
        const brand = document.getElementById('f-brand').value;
        const model = document.getElementById('f-model').value;
        if (!brand) return;
        document.getElementById('search-input').value = [brand, model].filter(Boolean).join(' ');
        doSearch();
    }

    document.getElementById('f-brand').addEventListener('change', onBrandChange);
    document.getElementById('f-model').addEventListener('change', runBrandSearch);

    const ERROR_CODES = new Set([
        'query_too_vague', 'query_empty', 'phone_too_short',
        'car_invalid_key', 'car_not_found', 'cooldown', 'rate_limited',
    ]);

    function errorMessage(detail) {
        if (detail && typeof detail === 'object' && ERROR_CODES.has(detail.code)) {
            return t('err_' + detail.code, detail);
        }
        return t('err_unknown');
    }

    function showSearchError(meta, message) {
        meta.innerHTML = '';
        const span = document.createElement('span');
        span.className = 'text-accent';
        span.textContent = message;
        meta.appendChild(span);
    }

    async function doSearch(opts = {}) {
        if (opts.resetPage !== false) currentPage = 1;

        const payload = buildSearchPayload();
        const fields = Object.keys(payload).filter(k => k !== 'page');
        if (fields.length === 0) return;
        // მხოლოდ სიმბოლოებისგან/პუნქტუაციისგან შემდგარი query API-მდე არ უშვებთ
        if (payload.query && fields.length === 1 &&
            payload.query.replace(/[^\p{L}\p{N}]/gu, '').length === 0) {
            document.body.classList.add('mode-results');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('results').innerHTML = '';
            showSearchError(document.getElementById('search-meta'), t('err_query_too_vague'));
            return;
        }
        pushHistory(document.getElementById('search-input').value);

        const _ckey = JSON.stringify(payload);
        const _hit = _searchCache.get(_ckey);
        if (_hit && Date.now() - _hit.t < _SEARCH_TTL) {
            lastResponse = _hit.data;
            document.body.classList.add('mode-results');
            document.getElementById('empty-state').classList.add('hidden');
            renderResults(_hit.data);
            return;
        }

        const btn = document.getElementById('btn-search');
        const meta = document.getElementById('search-meta');
        const empty = document.getElementById('empty-state');
        const results = document.getElementById('results');

        btn.disabled = true;
        btn.textContent = t('btn_searching');
        meta.textContent = '';
        empty.classList.add('hidden');
        document.body.classList.add('mode-results');
        if (currentPage === 1) results.innerHTML = skeletonCards(5);

        try {
            const resp = await fetch(`${API_BASE}/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Client-Id': CLIENT_ID },
                body: JSON.stringify(payload),
            });

            if (!resp.ok) {
                let detail = null;
                try { detail = (await resp.json()).detail; } catch {}
                showSearchError(meta, errorMessage(detail));
                results.innerHTML = '';
                lastResponse = null;
                return;
            }

            lastResponse = await resp.json();
            _searchCache.set(_ckey, { t: Date.now(), data: lastResponse });
            renderResults(lastResponse);
        } catch (e) {
            showSearchError(meta, t('err_fetch', { msg: e.message }));
        } finally {
            btn.disabled = false;
            btn.textContent = t('btn_search');
        }
    }

    document.getElementById('btn-search').onclick = () => doSearch();

    document.querySelectorAll('#search-input, .filter-input, .filter-select').forEach((el) => {
        el.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });
    });
    document.querySelectorAll('.filter-input, .filter-select').forEach((el) => {
        el.addEventListener('change', updateFilterResets);
        el.addEventListener('input', updateFilterResets);
    });
    document.getElementById('f-sort').addEventListener('change', () => {
        if (lastResponse) doSearch();
    });

    window.goToPage = function (page) {
        currentPage = page;
        doSearch({ resetPage: false });
        window.scrollTo(0, 0);
    };

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function specRow(label, value) {
        return `<div class="spec-label">${escapeHtml(label)}</div><div class="spec-value">${escapeHtml(value)}</div>`;
    }

    function splitPhones(phone) {
        if (!phone) return [];
        const digits = phone.replace(/\D/g, '');
        if (digits.length <= 12) return [phone];

        const chunks = digits.match(/.{1,12}/g) || [];
        return chunks.map((c) => {
            if (c.length === 12 && c.startsWith('995')) {
                const m = c.substring(3);
                return `+995 ${m.substring(0, 3)} ${m.substring(3, 6)} ${m.substring(6)}`;
            }
            if (c.length === 9 && /^[573]/.test(c)) {
                return `+995 ${c.substring(0, 3)} ${c.substring(3, 6)} ${c.substring(6)}`;
            }
            return '+' + c;
        });
    }

    function youtubeId(url) {
        if (!url) return null;
        const m = url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
        return m ? m[1] : null;
    }

    function formatDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const locale = getLang() === 'ka' ? 'ka-GE' : 'en-GB';
        return d.toLocaleDateString(locale, { day: 'numeric', month: 'short', year: 'numeric' });
    }


    const _slidesByCard = {};

    function slideStage(slide) {
        if (slide.type === 'video') {
            return `<iframe src="${escapeHtml(slide.src)}" allowfullscreen></iframe>`;
        }
        return `<img src="${escapeHtml(slide.src)}" alt="" loading="lazy" decoding="async" onerror="this.style.opacity=0.2">`;
    }

    const _preloaded = new Set();
    function preloadSlides(slides) {
        for (const s of slides) {
            if (s.type === 'image' && s.src && !_preloaded.has(s.src)) {
                _preloaded.add(s.src);
                new Image().src = s.src;
            }
        }
    }

    function thumbSrc(slide) {
        if (slide.type === 'video') {
            const id = (slide.src.match(/embed\/([\w-]+)/) || [])[1];
            return id ? `https://img.youtube.com/vi/${id}/default.jpg` : '';
        }
        return slide.src;
    }

    function photoBlockHtml(cardId, slides) {
        if (slides.length === 0) {
            return `<div class="no-photo w-full" style="aspect-ratio: 4 / 3;">${t('no_photos')}</div>`;
        }

        const counter = slides.length > 1
            ? `<div class="carousel-counter" id="${cardId}-counter">${t('photo_counter', { i: 1, n: slides.length })}</div>`
            : '';

        const main = `
            <div class="carousel w-full" id="${cardId}" data-index="0" onclick="openCardLightbox('${cardId}')">
                <div class="carousel-stage" id="${cardId}-stage">${slideStage(slides[0])}</div>
                ${counter}
            </div>
        `;

        if (slides.length === 1) return main;

        const visible = slides.slice(0, 8);
        const thumbsHtml = visible.map((s, i) => `
            <button class="thumb ${i === 0 ? 'is-active' : ''} ${s.type === 'video' ? 'is-video' : ''}"
                    onclick="event.stopPropagation(); switchCardSlide('${cardId}', ${i})">
                <img src="${escapeHtml(thumbSrc(s))}" alt="" loading="lazy" decoding="async" onerror="this.style.opacity=0.2">
            </button>
        `).join('');

        return main + `<div class="thumb-strip">${thumbsHtml}</div>`;
    }

    window.switchCardSlide = function (cardId, idx) {
        const slides = _slidesByCard[cardId];
        if (!slides || !slides[idx]) return;
        preloadSlides(slides);
        const carousel = document.getElementById(cardId);
        carousel.dataset.index = idx;
        document.getElementById(cardId + '-stage').innerHTML = slideStage(slides[idx]);
        const counter = document.getElementById(cardId + '-counter');
        if (counter) counter.textContent = t('photo_counter', { i: idx + 1, n: slides.length });
        const thumbs = carousel.parentElement.querySelectorAll('.thumb');
        thumbs.forEach((el, i) => el.classList.toggle('is-active', i === idx));
    };

    window.openCardLightbox = function (cardId) {
        const slides = _slidesByCard[cardId];
        if (!slides || !slides.length) return;
        const carousel = document.getElementById(cardId);
        const idx = parseInt(carousel.dataset.index, 10) || 0;
        openLightbox(slides, idx);
    };


    let _lightbox = null;

    window.openLightbox = function (slides, startIdx) {
        preloadSlides(slides);
        _lightbox = { slides, idx: Math.max(0, Math.min(startIdx || 0, slides.length - 1)) };
        document.body.style.overflow = 'hidden';
        renderLightbox();
        document.getElementById('lightbox').classList.remove('hidden');
    };

    window.closeLightbox = function () {
        document.getElementById('lightbox').classList.add('hidden');
        document.getElementById('lightbox-stage').innerHTML = '';
        document.body.style.overflow = '';
        _lightbox = null;
    };

    window.lightboxGo = function (delta) {
        if (!_lightbox) return;
        let idx = _lightbox.idx + delta;
        if (idx < 0) idx = _lightbox.slides.length - 1;
        if (idx >= _lightbox.slides.length) idx = 0;
        _lightbox.idx = idx;
        renderLightbox();
    };

    window.lightboxJump = function (idx) {
        if (!_lightbox) return;
        _lightbox.idx = idx;
        renderLightbox();
    };

    function renderLightbox() {
        const { slides, idx } = _lightbox;
        document.getElementById('lightbox-stage').innerHTML = slideStage(slides[idx]);
        document.getElementById('lightbox-counter').textContent = t('photo_counter', { i: idx + 1, n: slides.length });

        const thumbs = document.getElementById('lightbox-thumbs');
        thumbs.innerHTML = slides.map((s, i) => `
            <button class="lightbox-thumb ${i === idx ? 'is-active' : ''}" onclick="lightboxJump(${i})">
                <img src="${escapeHtml(thumbSrc(s))}" alt="">
            </button>
        `).join('');

        const active = thumbs.querySelector('.lightbox-thumb.is-active');
        if (active) active.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }

    document.addEventListener('keydown', (e) => {
        if (!_lightbox) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') lightboxGo(-1);
        else if (e.key === 'ArrowRight') lightboxGo(1);
    });

    function paginationHtml(data) {
        const totalPages = Math.max(1, Math.ceil(data.total_count / data.page_size));
        if (totalPages <= 1) return '';
        const prevDisabled = data.page <= 1 ? 'disabled' : '';
        const nextDisabled = data.page >= totalPages ? 'disabled' : '';
        return `
            <div class="pager">
                <button class="pager-btn" ${prevDisabled}
                        onclick="goToPage(${data.page - 1})">${t('page_prev')}</button>
                <span class="pager-info">${t('page_of', { p: data.page, n: totalPages })}</span>
                <button class="pager-btn" ${nextDisabled}
                        onclick="goToPage(${data.page + 1})">${t('page_next')}</button>
            </div>
        `;
    }

    function skeletonCards(n) {
        let s = '';
        for (let i = 0; i < n; i++) {
            s += '<div class="skeleton-card"><div class="sk sk-img"></div>'
               + '<div class="sk-body">'
               + '<div class="sk sk-line" style="width:55%"></div>'
               + '<div class="sk sk-line" style="width:32%;height:22px"></div>'
               + '<div class="sk sk-line" style="width:85%"></div>'
               + '<div class="sk sk-line" style="width:72%"></div></div></div>';
        }
        return s;
    }

    function renderResults(data) {
        const meta = document.getElementById('search-meta');
        const results = document.getElementById('results');

        let metaText = `<strong class="text-ink">${t('results_count', { n: data.total_count })}</strong>`;
        if (data.remaining_searches != null) {
            metaText += ` <span class="text-muted">· ${t('results_remaining', { n: data.remaining_searches })}</span>`;
        }
        if (data.results.length) {
            metaText += ` <button class="hist-chip" style="margin-left:10px;padding:4px 11px;font-size:12px" onclick="saveCurrentSearch(this)">♥ ${t('save_search')}</button>`;
        }
        meta.innerHTML = metaText;

        if (data.results.length === 0) {
            results.innerHTML = `<div class="py-16 text-center text-muted">${t('no_results')}</div>`;
            return;
        }

        for (const k in _slidesByCard) delete _slidesByCard[k];

        results.innerHTML = data.results.map((car, i) => {
            const cardId = `c${i}`;
            const title = [car.manufacturer, car.model, car.year].filter(Boolean).join(' ');
            const slides = buildSlides(car);
            _slidesByCard[cardId] = slides;
            const carKey = `${car.source}-${car.source_id}`;
            _carData[carKey] = { key: carKey, title, price: car.price_amount, currency: car.price_currency, thumb: (car.image_urls && car.image_urls[0]) || '' };

            return `
                <article class="card mb-4" style="animation-delay:${Math.min(i, 8) * 45}ms">
                  <div class="flex flex-col md:flex-row md:items-start">
                    <div class="md:w-96 flex-shrink-0 p-2 md:p-3">
                      ${photoBlockHtml(cardId, slides)}
                    </div>
                    <div class="p-4 md:p-6 flex-1 min-w-0">
                      <div class="flex items-start justify-between gap-4 mb-3">
                        <div class="min-w-0">
                          <h3 class="serif-display text-2xl text-ink leading-tight">
                            <a href="/car/${escapeHtml(carKey)}" class="card-title-link"
                               onclick="return goToCarDetail('${escapeHtml(carKey)}', event)">${escapeHtml(title)}</a>
                          </h3>
                          ${car.location ? `<p class="text-muted text-sm mt-1">${escapeHtml(tval(car.location))}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                          <button class="save-btn ${isCarSaved(carKey) ? 'is-saved' : ''}" data-key="${escapeHtml(carKey)}" onclick="toggleSave('${escapeHtml(carKey)}', this)" aria-label="save">${isCarSaved(carKey) ? '♥' : '♡'}</button>
                          <span class="source-badge source-${escapeHtml(car.source)}">${escapeHtml(car.source)}</span>
                        </div>
                      </div>

                      ${priceRowHtml(car)}
                      ${carBodyHtml(car)}
                    </div>
                  </div>
                </article>`;
        }).join('') + paginationHtml(data);
    }


    function buildSlides(car) {
        const slides = [];
        const ytId = youtubeId(car.video_url);
        if (ytId) {
            slides.push({ type: 'video', src: `https://www.youtube.com/embed/${ytId}` });
        }
        if (car.image_urls && car.image_urls.length) {
            for (const url of car.image_urls) slides.push({ type: 'image', src: url });
        }
        return slides;
    }

    function priceRowHtml(car) {
        const customsBadge = car.customs_cleared === true
            ? `<span class="customs-badge customs-yes ml-auto">${t('cleared')}</span>`
            : car.customs_cleared === false
            ? `<span class="customs-badge customs-no ml-auto">${t('not_cleared')}</span>`
            : '';
        return `
            <div class="flex items-baseline gap-3 mb-5">
              <span class="font-mono text-2xl font-medium text-price">
                ${car.price_amount > 0 ? car.price_amount.toLocaleString() : '—'}
              </span>
              <span class="text-muted text-sm uppercase tracking-wider">${escapeHtml(car.price_currency || '')}</span>
              ${customsBadge}
            </div>`;
    }

    function descriptionHtml(desc) {
        if (!desc) return '';
        const long = desc.length > 180 || (desc.match(/\n/g) || []).length > 4;
        return `
            <div class="border-t border-line pt-4 mb-4">
              <div class="desc-head mb-2">
                <span class="spec-label">${t('section_description')}</span>
                <button class="desc-translate" onclick="translateDesc(this)">${t('translate_btn')} ↗</button>
              </div>
              <div class="description${long ? ' clamped' : ''}">${escapeHtml(desc)}</div>
              ${long ? `<button class="see-more" onclick="toggleDesc(this)">${t('see_more')}</button>` : ''}
            </div>`;
    }

    // აღწერას Google Translate-ში ხსნის მიმდინარე ენაზე (ტექსტი public-ია)
    window.translateDesc = function (btn) {
        const box = btn.closest('div').parentElement.querySelector('.description');
        const text = (box && box.textContent || '').trim();
        if (!text) return;
        const url = 'https://translate.google.com/?sl=auto&tl=' +
            encodeURIComponent(getLang()) + '&op=translate&text=' + encodeURIComponent(text);
        window.open(url, '_blank', 'noopener');
    };

    window.toggleDesc = function (btn) {
        const desc = btn.parentElement.querySelector('.description');
        const clamped = desc.classList.toggle('clamped');
        btn.textContent = t(clamped ? 'see_more' : 'see_less');
    };

    function carBodyHtml(car) {
        const specs = [];
        if (car.mileage_km)      specs.push(specRow(t('spec_mileage'), car.mileage_km.toLocaleString() + ' km'));
        if (car.engine_volume_l) specs.push(specRow(t('spec_engine'),  car.engine_volume_l + ' L'));
        if (car.engine_type)     specs.push(specRow(t('spec_fuel'),    tval(car.engine_type)));
        if (car.gearbox)         specs.push(specRow(t('spec_gearbox'), tval(car.gearbox)));
        if (car.drive_wheels)    specs.push(specRow(t('spec_drive'),   tval(car.drive_wheels)));
        if (car.color)           specs.push(specRow(t('spec_color'),   tval(car.color)));
        if (car.steering)        specs.push(specRow(t('spec_steering'), tval(car.steering)));

        const phones = splitPhones(car.phone || '');
        const phoneBlock = phones.length ? `
            <div class="border-t border-line pt-4 mb-4">
              <div class="spec-label mb-2">${t('section_phone')}</div>
              <div class="phone-list">
                ${phones.map(p => `<a href="tel:${escapeHtml(p.replace(/\s/g, ''))}">${escapeHtml(p)}</a>`).join('')}
              </div>
              ${car.seller_name ? `<div class="text-muted text-xs mt-2">${escapeHtml(car.seller_name)}</div>` : ''}
            </div>` : '';

        const hasPostedDate = car.posted_date && car.posted_date.trim();
        const dateBlock = hasPostedDate
            ? `<div class="meta-line">${t('posted_on', { date: escapeHtml(car.posted_date.trim()) })}</div>`
            : `<div class="meta-note">${t('scraped_on_note', { date: formatDate(car.created_at) })}</div>`;

        return `
            ${specs.length ? `<div class="spec-grid mb-5">${specs.join('')}</div>` : ''}

            ${descriptionHtml(car.description)}

            ${car.vin ? `
              <div class="border-t border-line pt-4 mb-4">
                <div class="spec-label mb-2">${t('section_vin')}</div>
                <code class="font-mono text-sm text-ink">${escapeHtml(car.vin)}</code><button class="copy-btn" onclick="copyText('${escapeHtml(car.vin)}', this)" aria-label="Copy VIN" title="Copy VIN">⧉</button>
              </div>` : ''}

            ${phoneBlock}

            <div class="border-t border-line pt-4">
              ${dateBlock}
            </div>`;
    }


    const _CAR_KEY_RE = /^\/car\/((?:autopapa|myauto)-\d+)\/?$/;

    function parseRoute(path) {
        path = path || location.pathname;
        if (path === '/' || path === '') return { view: 'search' };
        const m = path.match(_CAR_KEY_RE);
        return m ? { view: 'detail', key: m[1] } : { view: 'notfound' };
    }

    function showNotFound() {
        document.getElementById('hero-section').classList.add('hidden');
        document.getElementById('search-section').classList.add('hidden');
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('results').innerHTML = `
            <div class="notfound">
              <div class="notfound-code">404</div>
              <p class="notfound-msg">${t('notfound_msg')}</p>
              <a href="/" class="detail-btn" onclick="return goToSearch(event)">${t('notfound_home')}</a>
            </div>`;
    }

    function showSearchView() {
        document.getElementById('hero-section').classList.remove('hidden');
        document.getElementById('search-section').classList.remove('hidden');
        if (lastResponse) {
            document.body.classList.add('mode-results');
            document.getElementById('empty-state').classList.add('hidden');
            renderResults(lastResponse);
        } else {
            document.body.classList.remove('mode-results');
            document.getElementById('results').innerHTML = '';
            document.getElementById('empty-state').classList.remove('hidden');
        }
    }

    function showDetailView(key) {
        document.getElementById('hero-section').classList.add('hidden');
        document.getElementById('search-section').classList.add('hidden');
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('results').innerHTML =
            `<div class="py-16 text-center text-muted">${t('detail_loading')}</div>`;
        fetchCarDetail(key);
    }

    async function fetchCarDetail(key) {
        const results = document.getElementById('results');
        try {
            const resp = await fetch(`${API_BASE}/car/${key}`);
            if (resp.status === 404) {
                showNotFound();
                return;
            }
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const car = await resp.json();
            renderDetail(car);
        } catch (e) {
            results.innerHTML = `<div class="py-16 text-center text-accent">${t('err_fetch', { msg: e.message })}</div>`;
        }
    }

    let _detailSlides = [];
    let _detailCar = null;

    function renderDetail(car) {
        _detailCar = car;
        const title = [car.manufacturer, car.model, car.year].filter(Boolean).join(' ');
        const slides = buildSlides(car);
        _detailSlides = slides;

        const galleryHtml = slides.length
            ? `<div class="gallery">
                 ${slides.map((s, i) => `
                   <button class="gallery-tile ${s.type === 'video' ? 'is-video' : ''}"
                           onclick="openDetailLightbox(${i})">
                     <img src="${escapeHtml(thumbSrc(s))}" alt="" loading="lazy" decoding="async" onerror="this.style.opacity=0.2">
                   </button>
                 `).join('')}
               </div>`
            : `<div class="no-photo my-6" style="aspect-ratio: 4 / 3;">${t('no_photos')}</div>`;

        document.getElementById('results').innerHTML = `
            <article class="card">
              <div class="p-4 md:p-8">
                <div class="detail-bar">
                  <a href="/" class="detail-btn" onclick="return goToSearch(event)">${t('back_to_search')}</a>
                  <button class="detail-btn detail-icon-btn" onclick="copyDetailLink(this)" title="${t('copy_link')}" aria-label="${t('copy_link')}">⧉</button>
                </div>

                <div class="flex items-start justify-between gap-4 mb-3">
                  <div class="min-w-0">
                    <h1 class="serif-display detail-title text-ink">${escapeHtml(title)}</h1>
                    ${car.location ? `<p class="text-muted text-sm mt-2">${escapeHtml(tval(car.location))}</p>` : ''}
                  </div>
                  <span class="source-badge source-${escapeHtml(car.source)} shrink-0">${escapeHtml(car.source)}</span>
                </div>

                ${priceRowHtml(car)}

                ${galleryHtml}

                ${carBodyHtml(car)}

                ${car.url ? `
                  <div class="mt-6">
                    <a href="${escapeHtml(car.url)}" target="_blank" rel="noopener" class="detail-btn">
                      ${t('detail_open_source')} ↗
                    </a>
                  </div>` : ''}
              </div>
            </article>`;
    }

    window.openDetailLightbox = function (idx) {
        if (_detailSlides.length) openLightbox(_detailSlides, idx);
    };

    window.goToCarDetail = function (key, ev) {
        if (ev) ev.preventDefault();
        history.pushState({ view: 'detail', key }, '', `/car/${key}`);
        showDetailView(key);
        window.scrollTo(0, 0);
        return false;
    };

    window.goToSearch = function (ev) {
        if (ev) ev.preventDefault();
        history.pushState({ view: 'search' }, '', '/');
        showSearchView();
        window.scrollTo(0, 0);
        return false;
    };

    window.copyDetailLink = function (btn) {
        const url = location.href;
        const reset = (orig) => setTimeout(() => {
            btn.textContent = orig;
            btn.classList.remove('is-copied');
        }, 1500);
        const orig = btn.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
                btn.textContent = '✓';
                btn.classList.add('is-copied');
                reset(orig);
            }).catch(() => {
                window.prompt('', url);
            });
        } else {
            window.prompt('', url);
        }
    };

    window.copyText = function (text, btn) {
        const orig = btn.textContent;
        const done = () => {
            btn.textContent = '✓';
            btn.classList.add('is-copied');
            setTimeout(() => { btn.textContent = orig; btn.classList.remove('is-copied'); }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(() => window.prompt('', text));
        } else {
            window.prompt('', text);
        }
    };

    window.quickSearch = function (q) {
        const el = document.getElementById('search-input');
        if (el) el.value = q;
        doSearch();
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    (function loadHeroCount() {
        fetch(API_BASE + '/stats')
            .then((r) => (r.ok ? r.json() : null))
            .then((d) => {
                if (!d || typeof d.total_cars !== 'number') return;
                const el = document.getElementById('hero-count');
                if (el) el.textContent = d.total_cars.toLocaleString() + '+';
            })
            .catch(() => {});
    })();

    // ?q=... → run that search on load (shareable links + enables the SearchAction)
    (function applyQueryParam() {
        setTimeout(() => {
            try {
                const q = new URLSearchParams(location.search).get('q');
                if (q && q.trim() && location.pathname === '/') {
                    const el = document.getElementById('search-input');
                    if (el) el.value = q.trim();
                    doSearch();
                }
            } catch (_) {}
        }, 0);
    })();

    // --- saved cars / searches / history (localStorage; no account needed) ---
    const _carData = {};
    const LS_CARS = 'cdb_saved', LS_SEARCHES = 'cdb_searches', LS_HIST = 'cdb_history';
    function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (_) { return []; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }

    function getSavedCars() { return lsGet(LS_CARS); }
    function isCarSaved(key) { return getSavedCars().some(c => c.key === key); }
    window.toggleSave = function (key, btn) {
        let cars = getSavedCars();
        const had = cars.some(c => c.key === key);
        cars = had ? cars.filter(c => c.key !== key) : [(_carData[key] || { key: key, title: key }), ...cars].slice(0, 300);
        lsSet(LS_CARS, cars);
        refreshHearts();
        updateSavedCount();
    };

    function refreshHearts() {
        document.querySelectorAll('.save-btn[data-key]').forEach((b) => {
            const s = isCarSaved(b.dataset.key);
            b.classList.toggle('is-saved', s);
            b.textContent = s ? '♥' : '♡';
        });
    }

    window.saveCurrentSearch = function (btn) {
        const q = (document.getElementById('search-input').value || '').trim();
        const sort = document.getElementById('f-sort').value || '';
        let s = lsGet(LS_SEARCHES);
        const exists = s.some((x) => x.q === q && x.sort === sort);
        s = s.filter((x) => !(x.q === q && x.sort === sort));
        if (exists) {
            if (btn) btn.textContent = '♡ ' + t('save_search');
        } else {
            s = [{ q: q, sort: sort, label: q || ((lastResponse && lastResponse.query_type) || 'search') }, ...s];
            if (btn) btn.textContent = '♥ ' + t('saved_done');
        }
        lsSet(LS_SEARCHES, s.slice(0, 40));
        updateSavedCount();
    };
    function runSavedSearch(q, sort) {
        closeSaved();
        document.getElementById('search-input').value = q || '';
        document.getElementById('f-sort').value = sort || '';
        doSearch();
    }
    function runHistory(q) { closeSaved(); document.getElementById('search-input').value = q; doSearch(); }

    function pushHistory(q) {
        q = (q || '').trim();
        if (!q) return;
        let h = lsGet(LS_HIST).filter(x => x.toLowerCase() !== q.toLowerCase());
        h.unshift(q);
        lsSet(LS_HIST, h.slice(0, 12));
        renderRecent();
    }

    function renderRecent() {
        const row = document.getElementById('recent-row');
        if (!row) return;
        const h = lsGet(LS_HIST).slice(0, 8);
        row.innerHTML = h.length
            ? `<span class="recent-label">${t('recent_h')}</span>` + h.map((q, i) => `<button class="hist-chip" data-i="${i}">${escapeHtml(q)}</button>`).join('')
            : '';
        row.querySelectorAll('.hist-chip').forEach((b) => {
            b.onclick = () => { const q = lsGet(LS_HIST)[+b.dataset.i]; if (q) runHistory(q); };
        });
    }
    window.clearHistory = function () { lsSet(LS_HIST, []); renderSaved(); renderRecent(); };
    window.clearSavedCars = function () { lsSet(LS_CARS, []); updateSavedCount(); renderSaved(); };
    window.clearSavedSearches = function () { lsSet(LS_SEARCHES, []); updateSavedCount(); renderSaved(); };

    function updateSavedCount() {
        const el = document.getElementById('saved-count');
        if (el) el.textContent = getSavedCars().length + lsGet(LS_SEARCHES).length;
    }

    window.openSaved = function () { renderSaved(); document.getElementById('saved-overlay').classList.add('open'); document.getElementById('saved-drawer').classList.add('open'); document.body.style.overflow = 'hidden'; };
    window.closeSaved = function () { document.getElementById('saved-overlay').classList.remove('open'); document.getElementById('saved-drawer').classList.remove('open'); document.body.style.overflow = ''; };

    function renderSaved() {
        const cars = getSavedCars(), searches = lsGet(LS_SEARCHES), hist = lsGet(LS_HIST);
        let h = '';
        h += `<div class="drawer-sec"><span class="drawer-sec-h">${t('saved_cars_h')} · ${cars.length}</span>${cars.length ? `<button class="drawer-clear" onclick="clearSavedCars()">${t('clear_all')}</button>` : ''}</div>`;
        h += cars.length ? cars.map(c => `
            <div class="saved-row">
              <div class="grow flex items-center gap-3" data-key="${escapeHtml(c.key)}" data-act="open">
                <img src="${escapeHtml(c.thumb || '')}" alt="" onerror="this.style.visibility='hidden'">
                <div class="min-w-0"><div class="saved-row-title">${escapeHtml(c.title || c.key)}</div>${c.price ? `<div class="saved-row-price">${Number(c.price).toLocaleString()} ${escapeHtml(c.currency || '')}</div>` : ''}</div>
              </div>
              <button class="row-x" data-key="${escapeHtml(c.key)}" data-act="remove">✕</button>
            </div>`).join('') : `<div class="drawer-empty">${t('no_saved')}</div>`;

        h += `<div class="drawer-sec"><span class="drawer-sec-h">${t('saved_searches_h')} · ${searches.length}</span>${searches.length ? `<button class="drawer-clear" onclick="clearSavedSearches()">${t('clear_all')}</button>` : ''}</div>`;
        h += searches.length ? searches.map((s, i) => `<span class="chip-wrap"><button class="hist-chip" data-i="${i}" data-kind="search">♥ ${escapeHtml(s.label)}</button><button class="chip-del" data-i="${i}" data-kind="search" aria-label="delete">✕</button></span>`).join('') : `<div class="drawer-empty">—</div>`;

        h += `<div class="drawer-sec"><span class="drawer-sec-h">${t('recent_h')}</span>${hist.length ? `<button class="drawer-clear" onclick="clearHistory()">${t('clear_all')}</button>` : ''}</div>`;
        h += hist.length ? hist.map((q, i) => `<span class="chip-wrap"><button class="hist-chip" data-i="${i}" data-kind="hist">${escapeHtml(q)}</button><button class="chip-del" data-i="${i}" data-kind="hist" aria-label="delete">✕</button></span>`).join('') : `<div class="drawer-empty">—</div>`;

        const body = document.getElementById('saved-body');
        body.innerHTML = h;
        body.querySelectorAll('[data-act="open"]').forEach(el => el.onclick = (e) => { goToCarDetail(el.dataset.key, e); closeSaved(); });
        body.querySelectorAll('[data-act="remove"]').forEach(el => el.onclick = () => { toggleSave(el.dataset.key); renderSaved(); });
        body.querySelectorAll('.hist-chip').forEach(b => {
            b.onclick = () => {
                if (b.dataset.kind === 'search') { const s = lsGet(LS_SEARCHES)[+b.dataset.i]; if (s) runSavedSearch(s.q, s.sort); }
                else { const q = lsGet(LS_HIST)[+b.dataset.i]; if (q) runHistory(q); }
            };
        });
        body.querySelectorAll('.chip-del').forEach((b) => {
            b.onclick = (e) => {
                e.stopPropagation();
                const lk = b.dataset.kind === 'search' ? LS_SEARCHES : LS_HIST;
                const a = lsGet(lk); a.splice(+b.dataset.i, 1); lsSet(lk, a);
                updateSavedCount(); renderSaved(); renderRecent();
            };
        });
    }

    window.clearSearchInput = function () {
        const el = document.getElementById('search-input');
        el.value = ''; el.focus();
        document.getElementById('clear-search').classList.add('hidden');
    };

    (function wireExtras() {
        const el = document.getElementById('search-input'), x = document.getElementById('clear-search');
        if (el && x) { const tog = () => x.classList.toggle('hidden', !el.value); el.addEventListener('input', tog); tog(); }
        updateSavedCount();
        renderRecent();
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSaved(); });
    })();

    window.addEventListener('popstate', () => {
        const route = parseRoute();
        if (route.view === 'detail') showDetailView(route.key);
        else if (route.view === 'notfound') showNotFound();
        else showSearchView();
    });

    (function bootRoute() {
        const route = parseRoute();
        if (route.view === 'detail') showDetailView(route.key);
        else if (route.view === 'notfound') showNotFound();
    })();

    loadStats();
    loadMakes();
</script>

</body>
</html>
