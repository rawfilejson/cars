<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Car-DB</title>
    <meta name="description" content="Car listings archive - search by VIN, phone, or text. Free, no signup.">
    <meta name="theme-color" content="#2B2D42">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Car-DB - Georgian car listings">
    <meta property="og:description" content="Search Georgian car listings by VIN, phone, or text. Free, no signup.">
    <meta property="og:image" content="/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Car-DB - Georgian car listings">
    <meta name="twitter:description" content="Search by VIN, phone, or text. Free, no signup.">
    <link rel="canonical" href="https://cars.demee-metreveli.workers.dev/">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [{
          "@type": "WebSite",
          "name": "Car-DB",
          "url": "https://cars.demee-metreveli.workers.dev/",
          "description": "Search Georgian car listings by VIN, phone number, or text. Free, no sign-up.",
          "inLanguage": ["ka", "en"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://cars.demee-metreveli.workers.dev/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }, {
          "@type": "Organization",
          "name": "Car-DB",
          "url": "https://cars.demee-metreveli.workers.dev/"
        }]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://pub-5a5cb99bc7d2485faf5937207b078a27.r2.dev" crossorigin>
    <link rel="dns-prefetch" href="https://cars-api-w7pz.onrender.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500;600;700&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#EDF2F4',
              ink: '#2B2D42',
              muted: '#64748B',
              line: '#DCE3EA',
              accent: '#EF233C',
              'accent-soft': '#FDE6E8',
              'accent-dark': '#D90429',
              price: '#15803D',
            },
            fontFamily: {
              serif: ['Fraunces', 'Noto Serif Georgian', 'Georgia', 'serif'],
              sans: ['Inter Tight', 'Noto Sans Georgian', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>
    <script src="/config.js"></script>
    <script src="/i18n.js"></script>
    <script>
      if (window.CF_ANALYTICS_TOKEN) {
        const s = document.createElement('script');
        s.defer = true;
        s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        s.dataset.cfBeacon = JSON.stringify({
          token: window.CF_ANALYTICS_TOKEN
        });
        document.head.appendChild(s);
      }
    </script>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body class="min-h-screen flex flex-col">
    <div id="boot-overlay" class="boot-overlay" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-road">
          <svg class="boot-car" viewBox="0 0 64 34" fill="none" aria-hidden="true">
            <path d="M4 24h56M8 24v-3M56 24v-3" stroke="#DCE3EA" stroke-width="0" />
            <path d="M6 22h4l3-8h22l7 8h14a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3" stroke="#EF233C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M6 22a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h4" stroke="#EF233C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="19" cy="29" r="4" fill="#2B2D42" />
            <circle cx="45" cy="29" r="4" fill="#2B2D42" />
            <path d="M15 14l2-4h14l4 4" stroke="#2B2D42" stroke-width="2" stroke-linejoin="round" />
          </svg>
          <div class="boot-line"></div>
        </div>
        <div class="boot-title" data-i18n="boot_loading"></div>
        <div class="boot-sub" data-i18n="boot_sub"></div>
      </div>
    </div>
    <div class="top-rule">
      <div class="top-rule-fill" id="top-progress"></div>
    </div>
    <div class="offline-banner" id="offline-banner" role="status" aria-live="polite">
      <span class="offline-dot"></span>
      <span data-i18n="offline_msg"></span>
    </div>
    <header class="border-b border-line">
      <div class="max-w-6xl mx-auto px-4 md:px-6 py-5 md:py-6 flex items-start justify-between gap-3 md:gap-6">
        <div class="min-w-0">
          <a href="/" class="block">
            <h1 class="serif-display text-2xl md:text-4xl text-ink leading-none">Car <b class="brand-dot">·</b>DB </h1>
            <p class="text-xs md:text-sm text-muted mt-1 tracking-wide truncate" data-i18n="brand_sub"></p>
          </a>
        </div>
        <div class="flex items-center gap-3 md:gap-6 pt-1 md:pt-2 flex-shrink-0">
          <button class="saved-trigger" onclick="openSaved()" aria-label="saved">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
            </svg>
            <span class="cnt" id="saved-count">0</span>
          </button>
          <div class="lang-menu" id="lang-menu">
            <button class="lang-trigger" onclick="toggleLangMenu(event)" aria-label="language" aria-haspopup="true" aria-expanded="false">
              <svg class="lang-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18" />
                <path d="M12 3c2.6 2.5 4 5.6 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.6-4-9s1.4-6.5 4-9z" />
              </svg>
              <span id="lang-current">KA</span>
              <span class="lang-chev">▾</span>
            </button>
            <div class="lang-pop" role="menu" hidden>
              <button class="lang-opt" role="menuitem" data-lang="ka" onclick="pickLang('ka')">ქართული</button>
              <button class="lang-opt" role="menuitem" data-lang="en" onclick="pickLang('en')">English</button>
              <button class="lang-opt" role="menuitem" data-lang="ru" onclick="pickLang('ru')">Русский</button>
              <button class="lang-opt" role="menuitem" data-lang="kk" onclick="pickLang('kk')">Қазақша</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="flex-1">
      <section class="search-band max-w-6xl mx-auto px-4 md:px-6 pt-8 md:pt-12 pb-2">
        <h2 class="hero-title serif-display" data-i18n="hero_title"></h2>
        <p id="hero-desc" class="hero-desc" data-i18n="hero_desc"></p>
        <div class="searchbar">
          <span class="search-ic" aria-hidden="true">⌕</span>
          <input id="search-input" type="text" class="search-input" data-i18n-placeholder="ph_query" autocomplete="off">
          <button id="clear-search" class="clear-x hidden" type="button" aria-label="clear" onclick="clearSearchInput()">✕</button>
          <button id="btn-search" class="btn-search" data-search-btn></button>
        </div>
        <div class="hero-stats">
          <span class="hero-stat">
            <b id="hero-count">-</b>
            <span data-i18n="stat_cars"></span>
          </span>
        </div>
        <div class="chips" id="quick-chips">
          <button class="chip" onclick="quickSearch('Camry')">Camry</button>
          <button class="chip" onclick="quickSearch('RAV4')">RAV4</button>
          <button class="chip" onclick="quickSearch('Accord')">Accord</button>
          <button class="chip" onclick="quickSearch('Elantra')">Elantra</button>
          <button class="chip" onclick="quickSearch('Prius')">Prius</button>
          <button class="chip" onclick="quickSearch('Fusion')">Fusion</button>
          <button class="chip" onclick="quickSearch('Corolla')">Corolla</button>
          <button class="chip" onclick="quickSearch('X5')">X5</button>
        </div>
      </section>
      <div class="shell max-w-6xl mx-auto px-4 md:px-6 pb-16 md:pb-20">
        <button class="filters-toggle" type="button" onclick="toggleSidebar()">
          <svg class="ft-ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M7 12h10M10 18h4" />
          </svg>
          <span data-i18n="filters_toggle"></span>
        </button>
        <aside class="sidebar" id="filter-sidebar">
          <div class="sidebar-head">
            <h3 data-i18n="filters_toggle"></h3>
            <div class="sidebar-head-r">
              <button class="filter-clear" onclick="clearFilters()" data-i18n="filter_clear"></button>
              <button class="sidebar-close" type="button" onclick="toggleSidebar()" aria-label="close">✕</button>
            </div>
          </div>
          <div class="mt-5 flex flex-wrap items-center gap-3">
            <div class="filter-group" data-filter="brand">
              <span class="filter-label" data-i18n="filter_brand"></span>
              <select class="filter-select" id="f-brand" multiple data-search data-search-ph="ph_search">
                <option value="" data-i18n="brand_any"></option>
              </select>
              <button class="filter-reset" type="button" onclick="resetFilter('brand')" aria-label="reset">↺</button>
            </div>
            <div class="filter-group" data-filter="model">
              <span class="filter-label" data-i18n="filter_model"></span>
              <select class="filter-select" id="f-model" multiple data-search data-search-ph="ph_search" disabled>
                <option value="" data-i18n="model_any"></option>
              </select>
              <button class="filter-reset" type="button" onclick="resetFilter('model')" aria-label="reset">↺</button>
            </div>
          </div>
          <div class="mt-5 flex flex-wrap items-center gap-x-6 gap-y-3">
            <div class="filter-group" data-filter="year">
              <span class="filter-label" data-i18n="filter_year"></span>
              <select class="filter-select filter-year" id="f-year-from"></select>
              <span class="filter-dash">-</span>
              <select class="filter-select filter-year" id="f-year-to"></select>
              <button class="filter-reset" type="button" onclick="resetFilter('year')" aria-label="reset">↺</button>
            </div>
            <div class="filter-group" data-filter="price">
              <span class="filter-label" data-i18n="filter_price"></span>
              <input class="filter-input" type="number" id="f-price-from" data-i18n-placeholder="filter_from" min="0">
              <span class="filter-dash">-</span>
              <input class="filter-input" type="number" id="f-price-to" data-i18n-placeholder="filter_to" min="0">
              <button class="filter-reset" type="button" onclick="resetFilter('price')" aria-label="reset">↺</button>
            </div>
            <div class="filter-group filter-slider" data-filter="mileage">
              <span class="filter-label" data-i18n="filter_mileage"></span>
              <div class="mrange" id="mileage-range">
                <div class="mrange-bar">
                  <div class="mrange-fill" id="mileage-fill"></div>
                </div>
                <input type="range" class="mrange-input" id="mileage-r-from" min="0" max="1000000" step="5000" value="0" aria-label="mileage from">
                <input type="range" class="mrange-input" id="mileage-r-to" min="0" max="1000000" step="5000" value="1000000" aria-label="mileage to">
              </div>
              <div class="mrange-vals">
                <span id="mileage-v-from">0</span>
                <span id="mileage-v-to">1,000,000+</span>
              </div>
              <input type="hidden" id="f-mileage-from">
              <input type="hidden" id="f-mileage-to">
              <button class="filter-reset" type="button" onclick="resetFilter('mileage')" aria-label="reset">↺</button>
            </div>
          </div>
          <button type="button" class="more-toggle" onclick="toggleMoreFilters()">
            <span data-i18n="more_filters"></span>
            <span class="more-chev">▾</span>
          </button>
          <div class="mt-5 flex flex-wrap items-center gap-x-6 gap-y-3 more-filters" id="more-filters" hidden>
            <div class="filter-group" data-filter="body_type">
              <span class="filter-label" data-i18n="filter_body"></span>
              <select class="filter-select facet-select" id="f-body" multiple>
                <option value="" data-i18n="any_opt"></option>
              </select>
              <button class="filter-reset" type="button" onclick="resetFilter('body_type')" aria-label="reset">↺</button>
            </div>
            <div class="filter-group" data-filter="fuel">
              <span class="filter-label" data-i18n="filter_fuel"></span>
              <select class="filter-select facet-select" id="f-fuel" multiple>
                <option value="" data-i18n="any_opt"></option>
              </select>
              <button class="filter-reset" type="button" onclick="resetFilter('fuel')" aria-label="reset">↺</button>
            </div>
            <div class="filter-group" data-filter="gearbox">
              <span class="filter-label" data-i18n="filter_gearbox"></span>
              <select class="filter-select facet-select" id="f-gearbox" multiple>
                <option value="" data-i18n="any_opt"></option>
              </select>
              <button class="filter-reset" type="button" onclick="resetFilter('gearbox')" aria-label="reset">↺</button>
            </div>
            <div class="filter-group" data-filter="drive">
              <span class="filter-label" data-i18n="filter_drive"></span>
              <select class="filter-select facet-select" id="f-drive" multiple>
                <option value="" data-i18n="any_opt"></option>
              </select>
              <button class="filter-reset" type="button" onclick="resetFilter('drive')" aria-label="reset">↺</button>
            </div>
            <div class="filter-group" data-filter="location">
              <span class="filter-label" data-i18n="filter_location"></span>
              <select class="filter-select facet-select" id="f-location" multiple data-search data-search-ph="ph_search">
                <option value="" data-i18n="location_any"></option>
              </select>
              <button class="filter-reset" type="button" onclick="resetFilter('location')" aria-label="reset">↺</button>
            </div>
            <div class="filter-group" data-filter="customs">
              <span class="filter-label" data-i18n="filter_customs"></span>
              <select class="filter-select facet-select" id="f-customs">
                <option value="" data-i18n="customs_all"></option>
                <option value="yes" data-i18n="cleared"></option>
                <option value="no" data-i18n="not_cleared"></option>
              </select>
              <button class="filter-reset" type="button" onclick="resetFilter('customs')" aria-label="reset">↺</button>
            </div>
          </div>
          <button class="apply-btn" type="button" onclick="applyFilters()" data-search-btn></button>
          <div class="ad-slot" data-i18n="ad_label"></div>
        </aside>
        <div class="results-col">
          <div id="recent-row" class="recent-row"></div>
          <div class="results-bar">
            <p id="search-meta" class="results-meta"></p>
            <div id="sort-wrap" class="sort-wrap">
              <select class="filter-select" id="f-sort">
                <option value="" data-i18n="sort_default"></option>
                <option value="price_desc" data-i18n="sort_price_desc"></option>
                <option value="price_asc" data-i18n="sort_price_asc"></option>
                <option value="year_desc" data-i18n="sort_year_desc"></option>
                <option value="year_asc" data-i18n="sort_year_asc"></option>
                <option value="mileage_desc" data-i18n="sort_mileage_desc"></option>
                <option value="mileage_asc" data-i18n="sort_mileage_asc"></option>
              </select>
            </div>
          </div>
          <div id="results"></div>
          <div id="empty-state" class="empty-state" data-i18n="empty_state"></div>
        </div>
      </div>
    </main>
    <div id="saved-overlay" class="drawer-overlay" onclick="closeSaved()"></div>
    <aside id="saved-drawer" class="drawer" aria-label="saved">
      <div class="drawer-head">
        <h3 data-i18n="saved_title"></h3>
        <div class="drawer-head-acts">
          <button class="drawer-io" onclick="exportData()" data-i18n-title="export_data" aria-label="export">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V4M8 8l4-4 4 4" />
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
            </svg>
          </button>
          <button class="drawer-io" onclick="document.getElementById('import-file').click()" data-i18n-title="import_data" aria-label="import">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v11M8 11l4 4 4-4" />
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
            </svg>
          </button>
          <input type="file" id="import-file" accept="application/json,.json" style="display:none" onchange="importData(this)">
          <button class="clear-x" style="font-size:20px" onclick="closeSaved()" aria-label="close">✕</button>
        </div>
      </div>
      <div id="saved-body" class="drawer-body"></div>
    </aside>
    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" onclick="if (event.target === this) closeLightbox()">
      <div class="lightbox-counter" id="lightbox-counter">- / -</div>
      <button class="lightbox-close" onclick="closeLightbox()" aria-label="close">✕</button>
      <div class="lightbox-stage" id="lightbox-stage" onclick="if (event.target === this) closeLightbox()"></div>
      <button class="lightbox-prev" onclick="lightboxGo(-1)" aria-label="prev">‹</button>
      <button class="lightbox-next" onclick="lightboxGo(1)" aria-label="next">›</button>
      <div class="lightbox-thumbs" id="lightbox-thumbs"></div>
    </div>
    <footer class="border-t border-line">
      <div class="footer-inner max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-8">
        <p class="footer-about" data-i18n="footer_about"></p>
        <p class="footer-links">
          <a href="/terms.html" class="footer-link" data-i18n="footer_legal"></a>
          <a href="https://instagram.com/deme.brn" target="_blank" rel="noopener" class="footer-link">@deme.brn</a>
        </p>
      </div>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
