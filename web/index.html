        .card { border: 1px solid #DCE3EA; background: white; border-radius: 18px; overflow: hidden; transition: border-color 150ms, box-shadow 150ms; }

        .carousel { position: relative; background: #2B2D42; overflow: hidden; aspect-ratio: 4 / 3; cursor: zoom-in; }
        .carousel-stage { position: absolute; inset: 0; }
        .carousel-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .carousel-stage iframe { width: 100%; height: 100%; border: 0; display: block; cursor: default; }
        .carousel-counter {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(43,45,66,0.75); color: #EDF2F4;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            padding: 2px 8px; border-radius: 3px;
            letter-spacing: 0.05em;
            pointer-events: none;
        }
        /* ფოტოს ისრები — fullscreen-ის გარეშე გადასვლა (ბარათზე და გვერდზე) */
        .ph-nav {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
            width: 34px; height: 34px; border-radius: 50%; border: 0;
            background: rgba(255,255,255,.92); color: #2B2D42; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; line-height: 1; padding: 0 0 3px;
            box-shadow: 0 2px 10px rgba(43,45,66,.28);
            opacity: 0; transition: opacity .15s, background .15s, color .15s, transform .1s;
        }
        .carousel:hover .ph-nav, .dt-main:hover .ph-nav { opacity: 1; }
        .ph-nav:hover { background: #fff; color: #EF233C; }
        .ph-nav:active { transform: translateY(-50%) scale(.9); }
        .ph-prev { left: 8px; }
        .ph-next { right: 8px; }
        @media (hover: none) { .ph-nav { opacity: .9; } }


        .thumb-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; }
        .thumb {
            aspect-ratio: 4 / 3; overflow: hidden; background: #E2E8EE;
            border: 2px solid transparent; padding: 0; cursor: pointer;
            transition: border-color 100ms, opacity 100ms; opacity: 0.85;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb:hover { opacity: 1; }
        .thumb.is-active { border-color: #2B2D42; opacity: 1; }
        .thumb.is-video {
            position: relative;
        }
        .thumb.is-video::after {
            content: "▶"; position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #EDF2F4; font-size: 16px;
            background: rgba(43,45,66,0.4); pointer-events: none;
        }


        .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(15,12,8,0.96); display: flex; flex-direction: column; padding: 16px; }
        .lightbox.hidden { display: none; }
        .lightbox-stage {
            flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .lightbox-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .lightbox-stage iframe { width: min(90vw, 1280px); height: min(80vh, 720px); border: 0; }
        .lightbox-prev, .lightbox-next {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(250,247,242,0.08); color: #EDF2F4;
            width: 56px; height: 56px; border: 0; cursor: pointer;
            font-size: 22px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background 100ms;
        }
        .lightbox-prev:hover, .lightbox-next:hover, .lightbox-prev:active, .lightbox-next:active { background: rgba(250,247,242,0.22); }
        .lightbox-prev { left: 8px; }
        .lightbox-next { right: 8px; }
        .lightbox-close {
            position: absolute; top: 12px; right: 12px;
            background: rgba(250,247,242,0.18); color: #EDF2F4;
            width: 48px; height: 48px; border: 0; cursor: pointer;
            font-size: 22px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background 100ms;
            z-index: 3;
        }
        .lightbox-close:hover, .lightbox-close:active { background: rgba(250,247,242,0.35); }
        .lightbox-counter {
            position: absolute; top: 20px; left: 20px;
            color: #EDF2F4; font-family: 'JetBrains Mono', monospace; font-size: 13px;
            letter-spacing: 0.06em;
        }
        .lightbox-thumbs {
            display: flex; gap: 6px; padding-top: 12px; justify-content: center;
            overflow-x: auto; flex-shrink: 0;
            scrollbar-width: thin; scrollbar-color: #555 transparent;

        .lightbox-thumb {
            width: 64px; height: 48px; flex-shrink: 0;
            overflow: hidden; cursor: pointer;
            border: 2px solid transparent; opacity: 0.55;
            transition: opacity 100ms, border-color 100ms;
            background: #2B2D42; padding: 0;
        }
        @media (min-width: 640px) { .lightbox-thumb { width: 84px; height: 63px; } }
        .lightbox-thumb:hover { opacity: 0.9; }
        .lightbox-thumb.is-active { border-color: #EF233C; opacity: 1; }
        .lightbox-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }


        .desc-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .desc-translate {
            display: inline-flex; align-items: center; gap: 6px;

        .tr-ic { flex-shrink: 0; }

        /* პატარა press-ანიმაცია ყველა ღილაკზე */
        .btn-search, .apply-btn, .dt-call, .dt-source, .chip, .pager-btn, .detail-btn,
        .save-btn, .saved-trigger, .cdd-btn, .filter-clear, .dt-thumb {
            transition: transform .12s ease, background-color .15s, border-color .15s, color .15s, box-shadow .15s;
        }
        .btn-search:active, .apply-btn:active, .dt-call:active, .dt-source:active, .chip:active,
        .pager-btn:active, .detail-btn:active, .saved-trigger:active, .cdd-btn:active { transform: scale(.96); }

        .phone-list { display: flex; flex-direction: column; gap: 4px; }

        .card-title-link { color: inherit; text-decoration: none; }

        .detail-btn {
            display: inline-flex; align-items: center; justify-content: center;

        .footer-inner { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }

        /* product polish — elevation, motion, quick chips */
        #results .rcard { animation: cardIn .42s cubic-bezier(.2,.7,.2,1) both; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .rcard { display: flex; align-items: stretch; min-height: 188px; background: #fff; border: 1px solid #DCE3EA; border-radius: 18px; overflow: hidden; margin-bottom: 14px; transition: box-shadow .15s, transform .15s; }
        .rcard:hover { box-shadow: 0 12px 34px rgba(43,45,66,.12); transform: translateY(-2px); }
        .rcard-photo { width: 290px; flex-shrink: 0; align-self: stretch; position: relative; }
        .rcard-photo .carousel { aspect-ratio: auto; height: 100%; min-height: 100%; }
        .rcard-body { flex: 1; min-width: 0; padding: 16px 20px; display: flex; flex-direction: column; }
        .rcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

        .rcard-specs { display: flex; flex-wrap: wrap; gap: 7px; margin: 13px 0 9px; }
        .rcard-vin { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6B7280; letter-spacing: .03em; margin-bottom: 10px; }
        .rcard-vin span { color: #64748B; }
        .rcard-contact { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 14px; margin-bottom: 10px; }
        .rcard-contact .rc-vin { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #64748B; letter-spacing: .03em; }
        .rcard-contact .rc-phone { font-size: 12px; font-weight: 600; color: #EF233C; text-decoration: none; }
        .rcard-contact .rc-phone:hover { text-decoration: underline; }
        .spec-pill { display: inline-flex; align-items: center; gap: 6px; background: #F3F6F8; border: 1px solid #E7ECF1; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; color: #2B2D42; }
        .pill-ic { width: 17px; height: 17px; color: #5B6475; flex-shrink: 0; }
        .spec-pill:hover .pill-ic { color: #EF233C; }
        .rcard-bot { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: auto; }
        .rcard-price { font-size: 25px; font-weight: 800; color: #2B2D42; letter-spacing: -.02em; }
        .rcard-badges { display: flex; gap: 7px; flex-shrink: 0; align-items: center; }
        @media (max-width: 560px) { .rcard { flex-direction: column; } .rcard-photo { width: 100%; } }

        .hero-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 20px; align-items: baseline; }
        .hero-stat { display: inline-flex; align-items: baseline; gap: 7px; color: #64748B; font-size: 14px; }
        .hero-stat b { font-family: 'JetBrains Mono', monospace; font-size: 19px; color: #2B2D42; font-weight: 600; }
        .hero-stat .dot { color: #15803D; font-size: 11px; transform: translateY(-1px); }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
        .chip {
            border: 1px solid #DCE3EA; background: #fff; color: #2B2D42; border-radius: 999px;
            padding: 7px 15px; font-size: 14px; cursor: pointer; white-space: nowrap;
            transition: border-color .14s, transform .14s, background .14s, color .14s;
        }
        .chip:hover { border-color: #2B2D42; transform: translateY(-1px); }
        .chip:active { transform: translateY(0); }
        .chip.is-accent { background: #2B2D42; color: #EDF2F4; border-color: #2B2D42; }
        .chip.is-accent:hover { background: #EF233C; border-color: #EF233C; }

        /* search -> results: hero collapses so results lead */
        body.mode-results #hero-desc { display: none; }

        /* skeleton loading cards (shimmer) */
        .skeleton-card { display: flex; overflow: hidden; border: 1px solid #DCE3EA; border-radius: 14px; background: #fff; margin-bottom: 16px; }
        .sk { position: relative; overflow: hidden; background: #ECE6DA; border-radius: 8px; }
        .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation: shimmer 1.25s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .sk-img { width: 38%; min-height: 160px; }
        .sk-body { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 13px; }
        .sk-line { height: 14px; }
        @media (max-width: 767px) { .skeleton-card { flex-direction: column; } .sk-img { width: 100%; min-height: 190px; } }

        /* micro-interactions — press feedback + hover lifts everywhere */
        .btn-search, .apply-btn, .save-btn, .copy-btn, .detail-btn, .cdd-btn, .chip, .hist-chip,
        .pager-btn, .lang-opt, .lang-trigger, .filter-reset, .more-toggle, .spec-pill, .tab,
        .saved-trigger, .ph-nav { transition: transform .12s ease, box-shadow .12s, background .12s, border-color .12s, color .12s; }
        .btn-search:active, .apply-btn:active, .save-btn:active, .copy-btn:active, .detail-btn:active,
        .cdd-btn:active, .chip:active, .hist-chip:active, .pager-btn:active, .lang-opt:active,
        .filter-reset:active, .more-toggle:active, .spec-pill:active, .tab:active, .ph-nav:active { transform: scale(.95); }
        .spec-pill:hover { background: #FDE6E8; border-color: #FBD5DA; transform: translateY(-1px); }
        .chip:hover, .hist-chip:hover { transform: translateY(-1px); }
        .btn-search.is-busy { animation: btnPulse 1s ease-in-out infinite; }
        @keyframes btnPulse { 0%, 100% { opacity: 1; } 50% { opacity: .62; } }

        @media (prefers-reduced-motion: reduce) {
            #results .rcard, .chip { animation: none !important; transition: none !important; }
            #results .rcard:hover, .spec-pill:hover, .chip:hover, .hist-chip:hover { transform: none; }
            *:active { transform: none !important; }
            .btn-search.is-busy { animation: none !important; }
            .rcard.is-hiding { animation: none !important; opacity: 0; }
            .sk::after { animation: none; }
        }

        /* refined benefit pills (replace the green dots) */
        .hero-pill { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #EF233C; background: #FDE6E8; border-radius: 999px; padding: 5px 12px; font-weight: 500; }

        /* clear-X inside the search bar */
        .clear-x { color: #6B7280; font-size: 17px; line-height: 1; padding: 0 10px; background: transparent; border: 0; cursor: pointer; transition: color .12s; align-self: center; }
        .clear-x:hover { color: #2B2D42; }

        /* save (heart) button */
        .save-btn { background: transparent; border: 1px solid #DCE3EA; border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; color: #6B7280; transition: all .15s ease; flex-shrink: 0; }
        .save-btn:hover { border-color: #EF233C; color: #EF233C; transform: scale(1.08); }
        .save-btn.is-saved { color: #EF233C; border-color: #EF233C; background: #FDE6E8; }

        /* hover actions on a card (hide) */
        .rcard-acts { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .rcard-hide { background: #fff; border: 1px solid #DCE3EA; border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #6B7280; opacity: 0; transform: scale(.85); pointer-events: none; transition: opacity .15s, transform .15s, color .15s, border-color .15s, background .15s; }
        .rcard:hover .rcard-hide, .rcard-hide:focus-visible { opacity: 1; transform: scale(1); pointer-events: auto; }
        .rcard-hide:hover { color: #EF233C; border-color: #EF233C; background: #FDE6E8; }
        .rcard-hide svg { width: 17px; height: 17px; }
        .rcard.is-hiding { animation: cardHide .28s cubic-bezier(.4,0,.2,1) forwards; }
        @keyframes cardHide { to { opacity: 0; transform: translateX(26px) scale(.96); } }
        @media (hover: none) { .rcard-hide { opacity: 1; transform: none; pointer-events: auto; } }

        /* toast */
        .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(10px); background: #2B2D42; color: #fff; border-radius: 12px; padding: 11px 16px; font-size: 14px; display: flex; align-items: center; gap: 14px; box-shadow: 0 10px 30px rgba(43,45,66,.28); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 1200; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast button { background: none; border: 0; color: #FF8A95; font-weight: 500; font-size: 14px; cursor: pointer; padding: 2px 4px; }
        .toast button:hover { color: #fff; }

        /* compare button on a card */
        .rcard-compare { background: #fff; border: 1px solid #DCE3EA; border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #6B7280; opacity: 0; transform: scale(.85); pointer-events: none; transition: opacity .15s, transform .15s, color .15s, border-color .15s, background .15s; }

        .rcard-compare.on { color: #fff; background: #EF233C; border-color: #EF233C; }
        .rcard-compare svg { width: 17px; height: 17px; }
        @media (hover: none) { .rcard-compare { opacity: 1; transform: none; pointer-events: auto; } }

        /* compare tray (bottom bar) */
        .cmp-bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; align-items: center; gap: 12px; background: #fff; border: 1px solid #DCE3EA; border-radius: 14px; padding: 10px 12px 10px 16px; box-shadow: 0 14px 40px rgba(43,45,66,.20); z-index: 1150; max-width: calc(100vw - 24px); }

        .cmp-bar-clear { background: none; border: 0; color: #64748B; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .cmp-bar-clear:hover { color: #EF233C; }

        /* compare modal */
        .cmp-modal { position: fixed; inset: 0; background: rgba(43,45,66,.5); z-index: 1300; display: none; align-items: flex-start; justify-content: center; padding: 28px 16px; overflow: auto; }

<script>
    const API_BASE = window.API_BASE || 'http://127.0.0.1:8765';

    const CLIENT_ID = (() => {
        try {
            let id = localStorage.getItem('cdb_cid');
            if (!id || !/^[A-Za-z0-9_-]{8,64}$/.test(id)) {
                const raw = (crypto.randomUUID && crypto.randomUUID())
                    || (Date.now().toString(36) + Math.random().toString(36).slice(2));
                id = raw.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
                localStorage.setItem('cdb_cid', id);
            }
            return id;
        } catch (_) {
            return '';
        }
    })();

    let lastResponse = null;
    let currentPage = 1;
    const _searchCache = new Map();
    const _SEARCH_TTL = 300000;

    async function loadStats() {
        try {
            const resp = await fetch(`${API_BASE}/stats`);
            if (!resp.ok) return;
            const data = await resp.json();
            _totalCars = data.total_cars;
            updateSearchBtnCount();
        } catch (_) {  }
    }

    let _totalCars = 0;
    let _lastCount = null;
    function updateSearchBtnCount() {
        const n = _lastCount != null ? _lastCount : _totalCars;
        const label = t('btn_search') + (n ? ` (${Number(n).toLocaleString()})` : '');
        document.querySelectorAll('[data-search-btn]').forEach(b => { b.textContent = label; });

    (function populateYears() {
        const now = new Date().getFullYear();
        const yFrom = document.getElementById('f-year-from');
        const yTo   = document.getElementById('f-year-to');
        const opts = ['<option value=""></option>'];
        for (let y = now; y >= 1900; y--) {
            opts.push(`<option value="${y}">${y}</option>`);
        }
        const html = opts.join('');
        yFrom.innerHTML = html;
        yTo.innerHTML = html;
        // არასწორი დიაპაზონის თავიდან აცილება — "დან" ყოველთვის <= "მდე"
        const fixRange = (changed) => {
            const f = parseInt(yFrom.value, 10), t = parseInt(yTo.value, 10);
            if (f && t && f > t) (changed === 'from' ? yTo : yFrom).value = (changed === 'from' ? yFrom : yTo).value;
        };
        yFrom.addEventListener('change', () => fixRange('from'));
        yTo.addEventListener('change', () => fixRange('to'));
    })();

    (function wireNumRanges() {
        const swap = (from, to) => {
            const f = parseFloat(from.value), t = parseFloat(to.value);
            if (!Number.isNaN(f) && !Number.isNaN(t) && f > t) {
                const tmp = from.value; from.value = to.value; to.value = tmp;

            const from = document.getElementById(a), to = document.getElementById(b);
            from.addEventListener('change', () => swap(from, to));

    function initMileageSlider() {

    // derive a class/series label from a base model name (myauto-style grouping)
    function _seriesOf(brand, model) {
        const b = brand.toLowerCase(); const m = model.trim();
        if (b === 'bmw') {
            if (/^\d/.test(m)) return m[0] + 'er';
            if (/^x\d?/i.test(m)) return 'X';
            if (/^m\d?/i.test(m)) return 'M';
            if (/^i\d?/i.test(m)) return 'i';
            if (/^z\d?/i.test(m)) return 'Z';
        } else if (b === 'mercedes-benz' || b === 'mercedes') {
            const c = m.toUpperCase().match(/^(GLE|GLC|GLS|GLA|GLB|GLK|GL|CLA|CLS|CLK|SLK|SLC|SL|[ABCEGRSVX])\b/);
            if (c) return c[1] + '-Class';
        } else if (b === 'audi') {
            const c = m.match(/^(RS|S|A|Q|TT|R8)/i);
            if (c) return c[1].toUpperCase();
        }
        return null;
    }

    function _buildModelOptions(brands, keep) {
        const out = [`<option value="">${escapeHtml(t('model_any'))}</option>`];
        const multiBrand = brands.length > 1;
        const opt = (m) => `<option value="${escapeHtml(m)}"${keep.has(m) ? ' selected' : ''}>${escapeHtml(m)}</option>`;
        for (const b of brands) {
            const groups = new Map(); const flat = [];
            for (const m of (_makes[b] || [])) {
                const s = _seriesOf(b, m);
                if (s) { if (!groups.has(s)) groups.set(s, []); groups.get(s).push(m); }
                else flat.push(m);
            }
            const prefix = multiBrand ? (b + ' · ') : '';
            if (groups.size) {
                // groups were inserted in model order (backend = count desc), so popular series lead
                for (const [series, ms] of groups.entries()) {
                    out.push(`<option disabled>${escapeHtml(prefix + series)}</option>`);
                    ms.forEach(m => out.push(opt(m)));
                }
                if (flat.length) { out.push(`<option disabled>${escapeHtml(prefix + t('other'))}</option>`); flat.forEach(m => out.push(opt(m))); }
            } else {
                if (multiBrand) out.push(`<option disabled>${escapeHtml(b)}</option>`);
                flat.forEach(m => out.push(opt(m)));
            }
        }
        return out.join('');
    }

    async function doSearch(opts = {}) {
        if (opts.resetPage !== false) currentPage = 1;

        const payload = buildSearchPayload();
        const fields = Object.keys(payload).filter(k => k !== 'page');
        if (fields.length === 0) return;
        // მხოლოდ სიმბოლოებისგან/პუნქტუაციისგან შემდგარი query API-მდე არ უშვებთ
        if (payload.query && fields.length === 1 &&
            payload.query.replace(/[^\p{L}\p{N}]/gu, '').length === 0) {
            document.body.classList.add('mode-results');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('results').innerHTML = '';
            showSearchError(document.getElementById('search-meta'), t('err_query_too_vague'));
            return;
        }
        pushHistory();

        const _ckey = JSON.stringify(payload);
        const _hit = _searchCache.get(_ckey);
        if (_hit && Date.now() - _hit.t < _SEARCH_TTL) {
            // quota is server-authoritative — don't replay a stale "searches left" from cache
            const cached = { ..._hit.data, remaining_searches: null };
            lastResponse = cached;
            document.body.classList.add('mode-results');
            document.getElementById('empty-state').classList.add('hidden');
            renderResults(cached);
            return;
        }

        const btn = document.getElementById('btn-search');
        const meta = document.getElementById('search-meta');
        const empty = document.getElementById('empty-state');
        const results = document.getElementById('results');

        btn.disabled = true;
        btn.textContent = t('btn_searching');
        document.querySelectorAll('[data-search-btn]').forEach(b => b.classList.add('is-busy'));
        meta.textContent = '';
        empty.classList.add('hidden');
        document.body.classList.add('mode-results');
        if (currentPage === 1) results.innerHTML = skeletonCards(5);

        try {
            const resp = await fetch(`${API_BASE}/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Client-Id': CLIENT_ID },
                body: JSON.stringify(payload),
            });

            if (!resp.ok) {
                let detail = null;
                try { detail = (await resp.json()).detail; } catch {}
                showSearchError(meta, errorMessage(detail));
                results.innerHTML = '';
                lastResponse = null;
                return;
            }

            lastResponse = await resp.json();
            _searchCache.set(_ckey, { t: Date.now(), data: lastResponse });
            renderResults(lastResponse);
        } catch (e) {
            showSearchError(meta, t('err_fetch', { msg: e.message }));
        } finally {
            btn.disabled = false;
            document.querySelectorAll('[data-search-btn]').forEach(b => b.classList.remove('is-busy'));
            updateSearchBtnCount();
        }
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // fallback extraction from the description text (when the structured field is empty)
    function vinFromText(text) {
        if (!text) return '';
        const cleaned = String(text).toUpperCase().replace(/[A-Z0-9]*\*+[A-Z0-9*]*/g, ' ');
        const m = cleaned.match(/\b[A-HJ-NPR-Z0-9]{17}\b/);
        return m ? m[0] : '';
    }
    function phoneFromText(text) {
        if (!text) return '';
        const m = String(text).match(/(?:\+?\s?995[\s\-.]?)?5\d{2}(?:[\s\-.]?\d){6}/);
        if (!m) return '';
        let d = m[0].replace(/\D/g, '');
        if (d.startsWith('995')) d = d.slice(3);
        if (d.length !== 9 || d[0] !== '5') return '';
        return '+995 ' + d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6);
    }

    function splitPhones(phone) {
        if (!phone) return [];
        const digits = phone.replace(/\D/g, '');
        if (digits.length <= 12) return [phone];

        const chunks = digits.match(/.{1,12}/g) || [];
        return chunks.map((c) => {
            if (c.length === 12 && c.startsWith('995')) {
                const m = c.substring(3);
                return `+995 ${m.substring(0, 3)} ${m.substring(3, 6)} ${m.substring(6)}`;
            }
            if (c.length === 9 && /^[573]/.test(c)) {
                return `+995 ${c.substring(0, 3)} ${c.substring(3, 6)} ${c.substring(6)}`;
            }
            return '+' + c;
        });
    }

    function youtubeId(url) {
        if (!url) return null;
        const m = url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
        return m ? m[1] : null;
    }

    function formatDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const locale = getLang() === 'ka' ? 'ka-GE' : 'en-GB';
        return d.toLocaleDateString(locale, { day: 'numeric', month: 'short', year: 'numeric' });
    }


    const _slidesByCard = {};

    function slideStage(slide) {
        if (slide.type === 'video') {
            return `<iframe src="${escapeHtml(slide.src)}" allowfullscreen></iframe>`;
        }
        return `<img src="${escapeHtml(slide.src)}" alt="" loading="lazy" decoding="async" onerror="this.style.opacity=0.2">`;
    }

    // photos are loaded lazily — only the slide you actually view fetches its
    // image (no eager preloading of a card's whole gallery).

    function thumbSrc(slide) {
        if (slide.type === 'video') {
            const id = (slide.src.match(/embed\/([\w-]+)/) || [])[1];
            return id ? `https://img.youtube.com/vi/${id}/default.jpg` : '';
        }
        return slide.src;
    }

    function photoBlockHtml(cardId, slides) {
        if (slides.length === 0) {
            return `<div class="no-photo w-full" style="aspect-ratio: 4 / 3;">${t('no_photos')}</div>`;
        }

        const counter = slides.length > 1
            ? `<div class="carousel-counter" id="${cardId}-counter">${t('photo_counter', { i: 1, n: slides.length })}</div>`
            : '';

        const arrows = slides.length > 1 ? `
                <button class="ph-nav ph-prev" onclick="event.stopPropagation(); cardSlideBy('${cardId}', -1)" aria-label="prev">‹</button>
                <button class="ph-nav ph-next" onclick="event.stopPropagation(); cardSlideBy('${cardId}', 1)" aria-label="next">›</button>` : '';
        const main = `
            <div class="carousel w-full" id="${cardId}" data-index="0" onclick="openCardLightbox('${cardId}')">
                <div class="carousel-stage" id="${cardId}-stage">${slideStage(slides[0])}</div>
                ${arrows}
                ${counter}
            </div>
        `;

        // ბარათზე thumb-strip აღარ — ისრები (‹ ›) და მთვლელი საკმარისია
        return main;
    }

    window.cardSlideBy = function (cardId, delta) {
        const slides = _slidesByCard[cardId];
        if (!slides || !slides.length) return;
        const carousel = document.getElementById(cardId);
        let idx = (+carousel.dataset.index || 0) + delta;
        if (idx < 0) idx = slides.length - 1;
        if (idx >= slides.length) idx = 0;
        switchCardSlide(cardId, idx);
    };

    window.switchCardSlide = function (cardId, idx) {
        const slides = _slidesByCard[cardId];
        if (!slides || !slides[idx]) return;
        const carousel = document.getElementById(cardId);
        carousel.dataset.index = idx;
        document.getElementById(cardId + '-stage').innerHTML = slideStage(slides[idx]);
        const counter = document.getElementById(cardId + '-counter');
        if (counter) counter.textContent = t('photo_counter', { i: idx + 1, n: slides.length });
        const thumbs = carousel.parentElement.querySelectorAll('.thumb');
        thumbs.forEach((el, i) => el.classList.toggle('is-active', i === idx));
    };

    window.openCardLightbox = function (cardId) {
        const slides = _slidesByCard[cardId];
        if (!slides || !slides.length) return;
        const carousel = document.getElementById(cardId);
        const idx = parseInt(carousel.dataset.index, 10) || 0;
        openLightbox(slides, idx);
    };


    let _lightbox = null;

    window.openLightbox = function (slides, startIdx) {
        _lightbox = { slides, idx: Math.max(0, Math.min(startIdx || 0, slides.length - 1)) };
        document.body.style.overflow = 'hidden';
        renderLightbox();
        document.getElementById('lightbox').classList.remove('hidden');
    };

    window.closeLightbox = function () {
        document.getElementById('lightbox').classList.add('hidden');
        document.getElementById('lightbox-stage').innerHTML = '';
        document.body.style.overflow = '';
        _lightbox = null;
    };

    // touch swipe — მარცხნივ/მარჯვნივ
    function addSwipe(el, onLeft, onRight) {
        if (!el) return;
        let x0 = null, y0 = null;
        el.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
        el.addEventListener('touchend', (e) => {
            if (x0 == null) return;
            const dx = e.changedTouches[0].clientX - x0;
            const dy = e.changedTouches[0].clientY - y0;
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) { dx < 0 ? onLeft() : onRight(); }
            x0 = y0 = null;
        }, { passive: true });
    }
    addSwipe(document.getElementById('lightbox-stage'), () => lightboxGo(1), () => lightboxGo(-1));

    window.lightboxGo = function (delta) {
        if (!_lightbox) return;
        let idx = _lightbox.idx + delta;
        if (idx < 0) idx = _lightbox.slides.length - 1;
        if (idx >= _lightbox.slides.length) idx = 0;
        _lightbox.idx = idx;
        renderLightbox();
    };

    window.lightboxJump = function (idx) {
        if (!_lightbox) return;
        _lightbox.idx = idx;
        renderLightbox();
    };

    function renderLightbox() {
        const { slides, idx } = _lightbox;
        document.getElementById('lightbox-stage').innerHTML = slideStage(slides[idx]);
        document.getElementById('lightbox-counter').textContent = t('photo_counter', { i: idx + 1, n: slides.length });

        const thumbs = document.getElementById('lightbox-thumbs');
        thumbs.innerHTML = slides.map((s, i) => `
            <button class="lightbox-thumb ${i === idx ? 'is-active' : ''}" onclick="lightboxJump(${i})">
                <img src="${escapeHtml(thumbSrc(s))}" alt="">
            </button>
        `).join('');

        const active = thumbs.querySelector('.lightbox-thumb.is-active');
        if (active) active.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }

    document.addEventListener('keydown', (e) => {
        if (!_lightbox) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') lightboxGo(-1);
        else if (e.key === 'ArrowRight') lightboxGo(1);
    });

    function paginationHtml(data) {
        const totalPages = Math.max(1, Math.ceil(data.total_count / data.page_size));
        if (totalPages <= 1) return '';
        const prevDisabled = data.page <= 1 ? 'disabled' : '';
        const nextDisabled = data.page >= totalPages ? 'disabled' : '';
        return `
            <div class="pager">
                <button class="pager-btn" ${prevDisabled}
                        onclick="goToPage(${data.page - 1})">${t('page_prev')}</button>
                <span class="pager-info">${t('page_of', { p: data.page, n: totalPages })}</span>
                <button class="pager-btn" ${nextDisabled}
                        onclick="goToPage(${data.page + 1})">${t('page_next')}</button>
            </div>
        `;
    }

    function skeletonCards(n) {
        let s = '';
        for (let i = 0; i < n; i++) {
            s += '<div class="skeleton-card"><div class="sk sk-img"></div>'
               + '<div class="sk-body">'
               + '<div class="sk sk-line" style="width:55%"></div>'

               + '<div class="sk sk-line" style="width:85%"></div>'
               + '<div class="sk sk-line" style="width:72%"></div></div></div>';

        return s;
    }

    // სათაური დუბლირებული სიტყვებით (ბინძური წყარო: manufacturer და model ერთი და იგივე)
    function carTitle(car) {
        const words = [car.manufacturer, car.model].filter(Boolean).join(' ').split(/\s+/);
        const seen = new Set();
        const out = [];
        for (const w of words) {
            const k = w.toLowerCase();
            if (k && !seen.has(k)) { seen.add(k); out.push(w); }
        }
        let title = out.join(' ');
        if (car.year) title += ' ' + car.year;
        return title;
    }

    let _toastTimer = null;

        let el = document.getElementById('toast');

        el.innerHTML = '<span></span>' + (actionLabel ? '<button type="button"></button>' : '');
        el.querySelector('span').textContent = msg;
        if (actionLabel) { const b = el.querySelector('button'); b.textContent = actionLabel; b.onclick = () => { if (actionFn) actionFn(); hideToast(); }; }
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(hideToast, 4500);

    function renderCompareModal() {

            [t('spec_mileage'),   c => c.mileage ? c.mileage.toLocaleString() + (en ? ' km' : ' კმ') : dash],
            [t('spec_engine'),    c => c.engine ? c.engine + ' L' : dash],
            [t('spec_power'),     c => c.power ? c.power + (en ? ' hp' : ' ც.ძ.') : dash],
            [t('filter_fuel'),    c => c.fuel ? escapeHtml(tval(c.fuel)) : dash],
            [t('filter_gearbox'), c => c.gearbox ? escapeHtml(tval(c.gearbox)) : dash],
            [t('filter_drive'),   c => c.drive ? escapeHtml(tval(c.drive)) : dash],
            [t('filter_body'),    c => c.body ? escapeHtml(tval(c.body)) : dash],
            [t('filter_location'),c => c.location ? escapeHtml(tval(c.location)) : dash],
        ];
        const head = list.map(c =>
            `<th><a href="${escapeHtml(c.url)}" onclick="return goToCarDetail('${escapeHtml(c.key)}', event)"><img class="cmp-car-img" src="${escapeHtml(c.thumb)}" alt="" loading="lazy" onerror="this.style.opacity=.2"></a>` +
            `<div class="cmp-car-title">${escapeHtml(c.title)}</div>` +
            `<div class="cmp-car-price">${c.price > 0 ? '$' + c.price.toLocaleString() : dash}</div>` +
            `<button class="cmp-remove" onclick="removeFromCompare('${escapeHtml(c.key)}')">✕ ${t('act_hide')}</button></th>`
        ).join('');
        const body = rows.map(([label, fn]) =>
            `<tr><td class="cmp-rowlabel">${label}</td>${list.map(c => `<td>${fn(c)}</td>`).join('')}</tr>`
        ).join('');
        modal.querySelector('.cmp-body').innerHTML =
            `<table class="cmp-table"><thead><tr><td class="cmp-rowlabel"></td>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }
    let _cmpOpener = null;
    function _cmpFocusables(modal) {
        return [...modal.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')]
            .filter(el => el.offsetParent !== null);
    }
    window.openCompare = function () {
        let modal = document.getElementById('cmp-modal');
        if (!modal) {
            modal = document.createElement('div'); modal.id = 'cmp-modal'; modal.className = 'cmp-modal';
            modal.setAttribute('role', 'dialog');
            modal.setAttribute('aria-modal', 'true');
            modal.setAttribute('aria-labelledby', 'cmp-title');
            modal.innerHTML = `<div class="cmp-sheet"><div class="cmp-sheet-head"><h3 id="cmp-title">${escapeHtml(t('compare_title'))}</h3><button class="cmp-x" onclick="closeCompare()" aria-label="close">✕</button></div><div class="cmp-body"></div></div>`;
            modal.addEventListener('click', (e) => { if (e.target === modal) closeCompare(); });
            modal.addEventListener('keydown', (e) => {
                if (e.key !== 'Tab') return;
                const f = _cmpFocusables(modal);
                if (!f.length) return;
                const first = f[0], last = f[f.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            });
            document.body.appendChild(modal);
        } else {
            modal.querySelector('h3').textContent = t('compare_title');
        }
        renderCompareModal();
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
        _cmpOpener = document.activeElement;
        const x = modal.querySelector('.cmp-x');
        if (x) x.focus();
    };
    window.closeCompare = function () {
        const modal = document.getElementById('cmp-modal');
        if (modal) modal.classList.remove('show');
        document.body.style.overflow = '';
        if (_cmpOpener && typeof _cmpOpener.focus === 'function') { _cmpOpener.focus(); }
        _cmpOpener = null;
    };
    window._refreshCompareUI = function () {
        renderCompareBar();
        const modal = document.getElementById('cmp-modal');
        if (modal && modal.classList.contains('show')) { modal.querySelector('h3').textContent = t('compare_title'); renderCompareModal(); }
    };

    function renderResults(data) {
        const meta = document.getElementById('search-meta');
        const results = document.getElementById('results');
        _lastCount = data.total_count;
        updateSearchBtnCount();

        for (const k in _slidesByCard) delete _slidesByCard[k];
        const _hidden = getHidden();
        const visible = data.results.filter(car => !_hidden.has(`${car.source}-${car.source_id}`));

        let metaText = `<strong class="text-ink">${t('results_count', { n: data.total_count })}</strong>`;
        if (data.remaining_searches != null) {
            metaText += ` <span class="text-muted">· ${t('results_remaining', { n: data.remaining_searches })}</span>`;
        }
        if (visible.length) {
            metaText += ` <button class="hist-chip" style="margin-left:10px;padding:4px 11px;font-size:12px" onclick="saveCurrentSearch(this)">♥ ${t('save_search')}</button>`;
        }
        meta.innerHTML = metaText;

        if (visible.length === 0) {
            results.innerHTML = `<div class="py-16 text-center text-muted">${t('no_results')}</div>`;
            return;
        }

        results.innerHTML = visible.map((car, i) => {
            const cardId = `c${i}`;
            const title = carTitle(car);
            const slides = buildSlides(car);
            _slidesByCard[cardId] = slides;
            const carKey = `${car.source}-${car.source_id}`;
            _carData[carKey] = { key: carKey, title, price: car.price_amount, currency: car.price_currency, thumb: (car.image_urls && car.image_urls[0]) || '' };
            _carFull[carKey] = car;

            const customsBadge = customsBadgeHtml(car);
            const cardVin = car.vin || vinFromText(car.description);
            const cardPhone = car.phone || phoneFromText(car.description);
            const contactLine = (cardVin || cardPhone)
                ? `<div class="rcard-contact">${cardVin ? `<span class="rc-vin">VIN ${escapeHtml(cardVin)}</span>` : ''}${cardPhone ? `<a class="rc-phone" href="tel:${escapeHtml(cardPhone.replace(/\s/g, ''))}" onclick="event.stopPropagation()">☎ ${escapeHtml(cardPhone)}</a>` : ''}</div>`
                : '';
            return `
                <article class="rcard" style="animation-delay:${Math.min(i, 8) * 45}ms">
                  <div class="rcard-photo">${photoBlockHtml(cardId, slides)}</div>
                  <div class="rcard-body">
                    <div class="rcard-top">
                      <div class="min-w-0">
                        <a class="rcard-title" href="/car/${escapeHtml(carKey)}"
                           onclick="return goToCarDetail('${escapeHtml(carKey)}', event)">${escapeHtml(title)}</a>
                        ${car.location ? `<div class="rcard-loc">${escapeHtml(tval(car.location))}</div>` : ''}
                      </div>
                      <div class="rcard-acts">
                        <button class="rcard-compare ${isInCompare(carKey) ? 'on' : ''}" data-key="${escapeHtml(carKey)}" aria-pressed="${isInCompare(carKey) ? 'true' : 'false'}" onclick="event.stopPropagation(); toggleCompare('${escapeHtml(carKey)}', this)" title="${t('act_compare')}" aria-label="${t('act_compare')}">${ICON_COMPARE}</button>
                        <button class="rcard-hide" onclick="event.stopPropagation(); hideCar('${escapeHtml(carKey)}', this)" title="${t('act_hide')}" aria-label="${t('act_hide')}">${ICON_HIDE}</button>
                        <button class="save-btn ${isCarSaved(carKey) ? 'is-saved' : ''}" data-key="${escapeHtml(carKey)}" aria-pressed="${isCarSaved(carKey) ? 'true' : 'false'}" onclick="event.stopPropagation(); toggleSave('${escapeHtml(carKey)}', this)" aria-label="save">${isCarSaved(carKey) ? '♥' : '♡'}</button>
                      </div>
                    </div>
                    <div class="rcard-specs">${carSpecPills(car)}</div>
                    ${contactLine}
                    <div class="rcard-bot">
                      <div class="rcard-price">${car.price_amount > 0 ? '$' + car.price_amount.toLocaleString() : '—'}</div>
                      <div class="rcard-badges">${customsBadge}${sourceBadgeHtml(car)}</div>
                    </div>
                  </div>
                </article>`;
        }).join('') + paginationHtml(data);
    }


    function buildSlides(car) {
        const slides = [];
        const ytId = youtubeId(car.video_url);
        if (ytId) {
            slides.push({ type: 'video', src: `https://www.youtube.com/embed/${ytId}` });
        }
        if (car.image_urls && car.image_urls.length) {
            for (const url of car.image_urls) slides.push({ type: 'image', src: url });
        }
        return slides;
    }

    function descriptionHtml(desc) {
        if (!desc) return '';
        const long = desc.length > 180 || (desc.match(/\n/g) || []).length > 4;
        return `
            <div class="desc-block">
              <div class="desc-head">
                <span class="spec-label">${t('section_description')}</span>
                <button class="desc-translate" onclick="translateDesc(this)" title="${t('translate_btn')}">
                  <svg class="tr-ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h7"/><path d="M9 3v2c0 4.418 -2.239 8 -5 8"/><path d="M5 9c0 2.144 2.952 3.908 6.7 4"/><path d="M11.5 21l4.5 -11l4.5 11"/><path d="M14.5 17.5l4.5 0"/></svg>
                  <span>${t('translate_btn')}</span>
                </button>
              </div>
              <div class="description${long ? ' clamped' : ''}">${escapeHtml(desc)}</div>
              ${long ? `<button class="see-more" onclick="toggleDesc(this)">${t('see_more')}</button>` : ''}
              <div class="tr-pop" hidden></div>
            </div>`;
    }

    // აღწერას ადგილზევე თარგმნის — ენის არჩევანით (English / Русский / Қазақша)
    const _TR_LANGS = [['en', 'English'], ['ru', 'Русский'], ['kk', 'Қазақша']];
    window.translateDesc = function (btn) {
        const block = btn.closest('.desc-block');
        const pop = block.querySelector('.tr-pop');
        if (!pop.hidden) { pop.hidden = true; btn.classList.remove('is-on'); return; }
        btn.classList.add('is-on');
        pop.hidden = false;
        pop.innerHTML =
            `<div class="tr-pop-head">
               <div class="tr-langs">${_TR_LANGS.map((l, i) => `<button class="tr-lang${i === 0 ? ' on' : ''}" data-tl="${l[0]}">${l[1]}</button>`).join('')}</div>
               <button class="tr-pop-x" onclick="this.closest('.tr-pop').hidden=true" aria-label="close">✕</button>
             </div>
             <div class="tr-pop-body" id="tr-body"></div>`;
        pop.querySelectorAll('.tr-lang').forEach((b) => b.onclick = () => {
            pop.querySelectorAll('.tr-lang').forEach((x) => x.classList.toggle('on', x === b));
            doTranslate(block, b.dataset.tl);
        });
        doTranslate(block, 'en');
    };

    async function doTranslate(block, tl) {
        const box = block.querySelector('.description');
        const body = block.querySelector('.tr-pop-body');
        const text = (box.textContent || '').trim();
        if (!text || !body) return;
        body.innerHTML = `<span class="tr-pop-load">${t('translating')}…</span>`;
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
            const resp = await fetch(url);
            const data = await resp.json();
            const out = (data[0] || []).map((s) => s[0]).join('');
            body.textContent = out || t('err_unknown');
        } catch (e) {
            body.textContent = t('err_unknown');
        }
    }

    window.toggleDesc = function (btn) {
        const desc = btn.parentElement.querySelector('.description');
        const clamped = desc.classList.toggle('clamped');
        btn.textContent = t(clamped ? 'see_more' : 'see_less');
    };

    const _CAR_KEY_RE = /^\/car\/((?:autopapa|myauto)-\d+)\/?$/;

    function parseRoute(path) {
        path = path || location.pathname;
        if (path === '/' || path === '') return { view: 'search' };
        const m = path.match(_CAR_KEY_RE);
        return m ? { view: 'detail', key: m[1] } : { view: 'notfound' };
    }

    function showNotFound() {
        document.body.classList.add('mode-detail');
        document.body.classList.remove('mode-results');
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('results').innerHTML = `
            <div class="notfound">
              <div class="notfound-code">404</div>
              <p class="notfound-msg">${t('notfound_msg')}</p>
              <a href="/" class="detail-btn" onclick="return goToSearch(event)">${t('notfound_home')}</a>
            </div>`;
    }

    function showSearchView() {
        document.body.classList.remove('mode-detail');
        if (lastResponse) {
            document.body.classList.add('mode-results');
            document.getElementById('empty-state').classList.add('hidden');
            renderResults(lastResponse);
        } else {
            document.body.classList.remove('mode-results');
            document.getElementById('results').innerHTML = '';
            document.getElementById('empty-state').classList.remove('hidden');
        }
    }

    function showDetailView(key) {
        document.body.classList.add('mode-detail');
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('results').innerHTML =
            `<div class="py-16 text-center text-muted">${t('detail_loading')}</div>`;
        fetchCarDetail(key);
    }

    async function fetchCarDetail(key) {
        const results = document.getElementById('results');
        try {
            const resp = await fetch(`${API_BASE}/car/${key}`);
            if (resp.status === 404) {
                showNotFound();
                return;
            }
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const car = await resp.json();
            renderDetail(car);
        } catch (e) {
            results.innerHTML = `<div class="py-16 text-center text-accent">${t('err_fetch', { msg: e.message })}</div>`;
        }
    }

    let _detailSlides = [];
    let _detailCar = null;

    let _detailMainIdx = 0;

    function renderDetail(car) {
        _detailCar = car;
        _detailMainIdx = 0;
        pushViewed(car);
        const title = carTitle(car);
        const slides = buildSlides(car);
        _detailSlides = slides;
        const km = getLang() === 'en' ? ' km' : ' კმ';

        const mainSrc = (s) => s && s.type === 'image' ? s.src : (s ? thumbSrc(s) : '');
        const gallery = slides.length ? `
            <div class="dt-gallery">
              <button class="dt-main" id="dt-main-btn" onclick="openDetailLightbox(0)">
                <img id="dt-main-img" src="${escapeHtml(mainSrc(slides[0]))}" alt="" decoding="async" onerror="this.style.opacity=.2">
                ${slides.length > 1 ? `<span class="dt-count">${t('photo_counter', { i: 1, n: slides.length })}</span>
                <span class="ph-nav ph-prev" onclick="event.stopPropagation(); dtSlideBy(-1)" role="button" aria-label="prev">‹</span>
                <span class="ph-nav ph-next" onclick="event.stopPropagation(); dtSlideBy(1)" role="button" aria-label="next">›</span>` : ''}
              </button>
              ${slides.length > 1 ? `<div class="dt-thumbs">${slides.slice(0, 14).map((s, i) =>
                  `<button class="dt-thumb ${i === 0 ? 'on' : ''}" onclick="dtSetMain(${i})"><img src="${escapeHtml(thumbSrc(s))}" alt="" loading="lazy" onerror="this.style.opacity=.2"></button>`).join('')}</div>` : ''}
            </div>` : `<div class="dt-gallery"><div class="no-photo" style="aspect-ratio:4/3;border-radius:14px">${t('no_photos')}</div></div>`;

        const srow = (k, v) => `<div class="dt-srow"><span class="k">${k}</span><span class="v">${escapeHtml(String(v))}</span></div>`;
        const specs = [];
        if (car.year)            specs.push(srow(t('spec_year'),     car.year));
        if (car.mileage_km)      specs.push(srow(t('spec_mileage'),  car.mileage_km.toLocaleString() + km));
        if (car.engine_volume_l) specs.push(srow(t('spec_engine'),   car.engine_volume_l + ' L'));
        if (car.engine_type)     specs.push(srow(t('spec_fuel'),     tval(car.engine_type)));
        if (car.gearbox)         specs.push(srow(t('spec_gearbox'),  tval(car.gearbox)));
        if (car.drive_wheels)    specs.push(srow(t('spec_drive'),    tval(car.drive_wheels)));
        if (car.color)           specs.push(srow(t('spec_color'),    tval(car.color)));
        if (car.steering)        specs.push(srow(t('spec_steering'), tval(car.steering)));

        const phones = splitPhones(car.phone || '');
        const calls = phones.length
            ? phones.map(p => `<a class="dt-call" href="tel:${escapeHtml(p.replace(/\s/g, ''))}">☎ ${escapeHtml(p)}</a>`).join('')
            : '';
        const customs = customsBadgeHtml(car);
        const price = car.price_amount > 0 ? '$' + car.price_amount.toLocaleString() : '—';
        const dateLine = car.posted_date && car.posted_date.trim()
            ? t('posted_on', { date: escapeHtml(car.posted_date.trim()) })
            : t('scraped_on_note', { date: formatDate(car.created_at) });
        const carKey = `${car.source}-${car.source_id}`;
        _carData[carKey] = { key: carKey, title, price: car.price_amount, currency: car.price_currency, thumb: (car.image_urls && car.image_urls[0]) || '' };
        const saved = isCarSaved(carKey);
        const pills = carSpecPills(car);
        const contact = [
            car.seller_name ? `<div class="dt-cline"><span class="dt-clabel">${t('section_seller')}</span><span class="dt-cval">${escapeHtml(car.seller_name)}</span></div>` : '',
            car.vin ? `<div class="dt-cline"><span class="dt-clabel">${t('section_vin')}</span><span class="dt-cval mono">${escapeHtml(car.vin)}<button class="copy-btn" data-copy="${escapeHtml(car.vin)}" onclick="copyText(this)" aria-label="Copy VIN" title="Copy VIN">${ICON_COPY}</button></span></div>` : '',
            phones.length ? `<div class="dt-cline"><span class="dt-clabel">${t('section_phone')}</span><span class="dt-cval">${phones.map(p => escapeHtml(p)).join(', ')}</span></div>` : '',
        ].filter(Boolean).join('');

        document.getElementById('results').innerHTML = `
            <div class="dt-bar">
              <a href="/" class="detail-btn" onclick="return goToSearch(event)">${t('back_to_search')}</a>
              <div class="dt-actions">
                <button class="save-btn dt-fav ${saved ? 'is-saved' : ''}" data-key="${escapeHtml(carKey)}" aria-pressed="${saved ? 'true' : 'false'}" onclick="toggleSave('${escapeHtml(carKey)}', this)" aria-label="save">${saved ? '♥' : '♡'}</button>
                <button class="detail-btn detail-icon-btn" onclick="copyDetailLink(this)" title="${t('copy_link')}" aria-label="${t('copy_link')}">${ICON_COPY}</button>
              </div>
            </div>
            <div class="dt-grid">
              ${gallery}
              <div class="dt-panel">
                <div class="dt-ptop">
                  <div class="min-w-0">
                    <h1 class="dt-title">${escapeHtml(title)}</h1>
                    ${car.location ? `<p class="dt-loc">${escapeHtml(tval(car.location))}</p>` : ''}
                  </div>
                  ${sourceBadgeHtml(car)}
                </div>
                ${pills ? `<div class="dt-pills">${pills}</div>` : ''}
                <div class="dt-pricebox"><span class="dt-price">${price}</span>${customs}</div>
                <div class="dt-specs">${specs.join('')}</div>
                ${calls ? `<div class="dt-calls">${calls}</div>` : ''}
                ${contact ? `<div class="dt-contact">${contact}</div>` : ''}
                ${car.url ? `<a href="${escapeHtml(car.url)}" target="_blank" rel="noopener" class="dt-source">${t('detail_open_source')} ↗</a>` : ''}
              </div>
            </div>
            ${car.description ? `<div class="dt-desc">${descriptionHtml(car.description)}</div>` : ''}
            <div class="dt-meta">${dateLine}</div>`;
        if (_detailSlides.length > 1) {
            addSwipe(document.getElementById('dt-main-btn'),
                () => dtSetMain(Math.min(_detailMainIdx + 1, _detailSlides.length - 1)),
                () => dtSetMain(Math.max(_detailMainIdx - 1, 0)));
        }
    }

    window.dtSetMain = function (i) {
        const s = _detailSlides[i];
        if (!s) return;
        _detailMainIdx = i;
        const img = document.getElementById('dt-main-img');
        if (img) img.src = s.type === 'image' ? s.src : thumbSrc(s);
        const btn = document.getElementById('dt-main-btn');
        if (btn) btn.setAttribute('onclick', `openDetailLightbox(${i})`);
        const c = document.querySelector('.dt-count');
        if (c) c.textContent = t('photo_counter', { i: i + 1, n: _detailSlides.length });
        document.querySelectorAll('.dt-thumb').forEach((el, j) => el.classList.toggle('on', j === i));
    };

    window.dtSlideBy = function (delta) {
        if (_detailSlides.length < 2) return;
        let i = _detailMainIdx + delta;
        if (i < 0) i = _detailSlides.length - 1;
        if (i >= _detailSlides.length) i = 0;
        dtSetMain(i);
    };

    window.openDetailLightbox = function (idx) {
        if (_detailSlides.length) openLightbox(_detailSlides, idx);
    };

    let _searchScrollY = 0;

    window.goToCarDetail = function (key, ev) {
        if (ev) ev.preventDefault();
        _searchScrollY = window.scrollY;
        history.pushState({ view: 'detail', key }, '', `/car/${key}`);
        showDetailView(key);
        window.scrollTo(0, 0);
        return false;
    };

    window.goToSearch = function (ev) {
        if (ev) ev.preventDefault();
        history.pushState({ view: 'search' }, '', '/');
        showSearchView();
        requestAnimationFrame(() => window.scrollTo(0, _searchScrollY));
        return false;
    };

    const ICON_COPY = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
    const ICON_CHECK = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>';

    function _copyFeedback(btn) {
        const orig = btn.innerHTML;
        btn.innerHTML = ICON_CHECK;
        btn.classList.add('is-copied');
        setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('is-copied'); }, 1300);
    }

    window.copyDetailLink = function (btn) {
        const url = location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => _copyFeedback(btn)).catch(() => window.prompt('', url));
        } else { window.prompt('', url); }
    };

    window.copyText = function (arg, maybeBtn) {
        // accept either copyText(text, btn) or copyText(buttonEl) — the element form
        // reads its value from data-copy, so scraped strings never enter a JS context
        let text, btn;
        if (arg && arg.nodeType === 1) { btn = arg; text = arg.getAttribute('data-copy') || ''; }
        else { text = arg; btn = maybeBtn; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => _copyFeedback(btn)).catch(() => window.prompt('', text));
        } else { window.prompt('', text); }
    };

    window.quickSearch = function (q) {
        const el = document.getElementById('search-input');
        if (el) el.value = q;
        doSearch();
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    (function loadHeroCount() {
        fetch(API_BASE + '/stats')
            .then((r) => (r.ok ? r.json() : null))
            .then((d) => {
                if (!d || typeof d.total_cars !== 'number') return;
                const el = document.getElementById('hero-count');
                if (el) el.textContent = d.total_cars.toLocaleString() + '+';
            })
            .catch(() => {});
    })();

    // ?q=... → run that search on load (shareable links + enables the SearchAction)
    (function applyQueryParam() {
        setTimeout(() => {
            try {
                const q = new URLSearchParams(location.search).get('q');
                if (q && q.trim() && location.pathname === '/') {
                    const el = document.getElementById('search-input');
                    if (el) el.value = q.trim();
                    doSearch();
                }
            } catch (_) {}
        }, 0);
    })();

    // --- saved cars / searches / history (localStorage; no account needed) ---
    const _carData = {};
    const LS_CARS = 'cdb_saved', LS_SEARCHES = 'cdb_searches', LS_HIST = 'cdb_history', LS_VIEWED = 'cdb_viewed';
    function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (_) { return []; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }

    // ნანახი მანქანების ისტორია
    function pushViewed(car) {
        const item = {
            key: `${car.source}-${car.source_id}`, title: carTitle(car),
            price: car.price_amount, currency: car.price_currency,
            thumb: (car.image_urls && car.image_urls[0]) || '',
        };
        let v = lsGet(LS_VIEWED).filter((x) => x.key !== item.key);
        v.unshift(item);
        lsSet(LS_VIEWED, v.slice(0, 40));
    }
    window.clearViewed = function () { lsSet(LS_VIEWED, []); renderSaved(); };

    function getSavedCars() { return lsGet(LS_CARS); }
    function isCarSaved(key) { return getSavedCars().some(c => c.key === key); }
    window.toggleSave = function (key, btn) {
        let cars = getSavedCars();
        const had = cars.some(c => c.key === key);
        cars = had ? cars.filter(c => c.key !== key) : [(_carData[key] || { key: key, title: key }), ...cars].slice(0, 300);
        lsSet(LS_CARS, cars);
        refreshHearts();
        updateSavedCount();
    };

    function refreshHearts() {
        document.querySelectorAll('.save-btn[data-key]').forEach((b) => {
            const s = isCarSaved(b.dataset.key);
            b.classList.toggle('is-saved', s);
            b.setAttribute('aria-pressed', s ? 'true' : 'false');
            b.textContent = s ? '♥' : '♡';
        });
