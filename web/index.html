    // შენახული ძიების ლამაზი წარწერა ყველა პარამეტრით
    function describeSearch(p) {
        const en = getLang() === 'en';
        const parts = [];
        if (p.query) parts.push(p.query);
        if (p.manufacturers && p.manufacturers.length) parts.push(p.manufacturers.join(', '));
        if (p.models && p.models.length) parts.push(p.models.join(', '));
        if (p.year_from || p.year_to) parts.push((p.year_from || '…') + '–' + (p.year_to || '…'));
        if (p.price_from || p.price_to) parts.push('$' + (p.price_from || '0') + '–' + (p.price_to || '∞'));
        if (p.mileage_from || p.mileage_to) parts.push((p.mileage_from || '0') + '–' + (p.mileage_to || '∞') + (en ? ' km' : ' კმ'));
        (p.body_types || []).forEach(v => parts.push(tval(v)));
        (p.fuels || []).forEach(v => parts.push(tval(v)));
        (p.gearboxes || []).forEach(v => parts.push(tval(v)));
        (p.drives || []).forEach(v => parts.push(tval(v)));
        (p.locations || []).forEach(v => parts.push(tval(v)));
        if (p.customs_cleared === true)  parts.push(t('cleared'));
        if (p.customs_cleared === false) parts.push(t('not_cleared'));
        if (p.sort) parts.push(t('sort_' + p.sort));
        return parts.join(' · ') || t('save_search');
    }

    window.saveCurrentSearch = function (btn) {
        const payload = buildSearchPayload();
        delete payload.page;
        if (Object.keys(payload).length === 0) return;
        const key = JSON.stringify(payload);
        let s = lsGet(LS_SEARCHES);
        const exists = s.some((x) => JSON.stringify(x.payload) === key);
        s = s.filter((x) => JSON.stringify(x.payload) !== key);
        if (exists) {
            if (btn) btn.textContent = '♡ ' + t('save_search');
        } else {
            s = [{ payload: payload, label: describeSearch(payload) }, ...s];
            if (btn) btn.textContent = '♥ ' + t('saved_done');
        }
        lsSet(LS_SEARCHES, s.slice(0, 40));
        updateSavedCount();
        renderRecent();
    };

    function _setVal(id, v) { const el = document.getElementById(id); if (el) el.value = (v == null ? '' : v); }
    function _setMulti(id, values) {
        const sel = document.getElementById(id);
        if (!sel) return;
        const set = new Set(values || []);
        Array.from(sel.options).forEach(o => { o.selected = o.value ? set.has(o.value) : false; });
    }
    function runSavedSearch(item) {
        closeSaved();
        const p = (item && item.payload) || (item && item.q != null ? { query: item.q, sort: item.sort } : {});
        _setVal('search-input', p.query);
        _setVal('f-year-from', p.year_from); _setVal('f-year-to', p.year_to);
        _setVal('f-price-from', p.price_from); _setVal('f-price-to', p.price_to);
        _setVal('f-mileage-from', p.mileage_from); _setVal('f-mileage-to', p.mileage_to);
        _setMulti('f-brand', p.manufacturers);
        document.getElementById('f-brand').dispatchEvent(new Event('change', { bubbles: true }));   // rebuild model options
        _setMulti('f-model', p.models);
        _setMulti('f-body', p.body_types);
        _setMulti('f-fuel', p.fuels);
        _setMulti('f-gearbox', p.gearboxes);
        _setMulti('f-drive', p.drives);
        _setMulti('f-location', p.locations);
        document.getElementById('f-customs').value = p.customs_cleared === true ? 'yes' : p.customs_cleared === false ? 'no' : '';
        _setVal('f-sort', p.sort);
        refreshDropdowns(); updateFilterResets();
        document.getElementById('search-input').dispatchEvent(new Event('input'));
        doSearch();
    }
    function runHistory(item) {
        if (item && item.payload) return runSavedSearch(item);
        const q = typeof item === 'string' ? item : '';
        closeSaved();
        const el = document.getElementById('search-input'); el.value = q; el.dispatchEvent(new Event('input')); doSearch();
    }

    function pushHistory() {
        const payload = buildSearchPayload();
        delete payload.page;
        if (Object.keys(payload).length === 0) return;
        const key = JSON.stringify(payload);
        const same = (x) => JSON.stringify((x && x.payload) || { query: x }) === key;
        let h = lsGet(LS_HIST).filter(x => !same(x));
        h.unshift({ payload, label: describeSearch(payload) });
        lsSet(LS_HIST, h.slice(0, 12));
        renderRecent();
    }
    function _histLabel(item) {
        return (item && item.label) || (item && item.payload ? describeSearch(item.payload) : String(item || ''));
    }
    function _saveHistItem(i) {
        const item = lsGet(LS_HIST)[i]; if (!item) return;
        const payload = (item && item.payload) || { query: String(item) };
        const key = JSON.stringify(payload);
        const s = lsGet(LS_SEARCHES);
        if (s.some(x => JSON.stringify(x.payload) === key)) return;   // already saved
        lsSet(LS_SEARCHES, [{ payload, label: describeSearch(payload) }, ...s].slice(0, 40));
        updateSavedCount(); renderRecent();
    }

    function renderRecent() {
        const row = document.getElementById('recent-row');
        if (!row) return;
        const saved = lsGet(LS_SEARCHES).slice(0, 6);
        const hist = lsGet(LS_HIST).slice(0, 8);
        if (!saved.length && !hist.length) { row.innerHTML = ''; return; }
        const rm = escapeHtml(t('remove')), sv = escapeHtml(t('save_search'));
        let html = '';
        if (saved.length) {
            html += `<span class="recent-label">${t('saved_searches_h')}</span>` +
                saved.map((s, i) => `<span class="chip-wrap"><button class="hist-chip pinned" data-kind="saved" data-i="${i}">♥ ${escapeHtml(s.label)}</button><button class="chip-del" data-kind="saved-del" data-i="${i}" aria-label="${rm}">✕</button></span>`).join('');
        }
        if (hist.length) {
            html += `<span class="recent-label">${t('recent_h')}</span>` +
                hist.map((item, i) => `<span class="chip-wrap"><button class="hist-chip" data-kind="hist" data-i="${i}">${escapeHtml(_histLabel(item))}</button><button class="chip-save" data-kind="hist-save" data-i="${i}" aria-label="${sv}" title="${sv}">♡</button><button class="chip-del" data-kind="hist-del" data-i="${i}" aria-label="${rm}">✕</button></span>`).join('') +
                `<button class="hist-chip recent-clear" data-kind="clear-all">✕ ${t('clear_all')}</button>`;
        }
        row.innerHTML = html;
        row.querySelectorAll('[data-kind]').forEach((b) => {
            b.onclick = (e) => {
                e.stopPropagation();
                const i = +b.dataset.i;
                switch (b.dataset.kind) {
                    case 'saved': { const s = lsGet(LS_SEARCHES)[i]; if (s) runSavedSearch(s); break; }
                    case 'saved-del': { const s = lsGet(LS_SEARCHES); s.splice(i, 1); lsSet(LS_SEARCHES, s); updateSavedCount(); renderRecent(); break; }
                    case 'hist': { const item = lsGet(LS_HIST)[i]; if (item) runHistory(item); break; }
                    case 'hist-save': _saveHistItem(i); break;
                    case 'hist-del': { const h = lsGet(LS_HIST); h.splice(i, 1); lsSet(LS_HIST, h); renderRecent(); break; }
                    case 'clear-all': lsSet(LS_HIST, []); renderRecent(); break;
                }
            };
        });
    }
    window.clearHistory = function () { lsSet(LS_HIST, []); renderSaved(); renderRecent(); };
    window.clearSavedCars = function () { lsSet(LS_CARS, []); updateSavedCount(); renderSaved(); };
    window.clearSavedSearches = function () { lsSet(LS_SEARCHES, []); updateSavedCount(); renderSaved(); };

    function updateSavedCount() {
        const el = document.getElementById('saved-count');
        if (el) el.textContent = getSavedCars().length + lsGet(LS_SEARCHES).length;
    }

    window.openSaved = function () { renderSaved(); document.getElementById('saved-overlay').classList.add('open'); document.getElementById('saved-drawer').classList.add('open'); document.body.style.overflow = 'hidden'; };
    window.closeSaved = function () { document.getElementById('saved-overlay').classList.remove('open'); document.getElementById('saved-drawer').classList.remove('open'); document.body.style.overflow = ''; };

    function renderSaved() {
        const cars = getSavedCars(), searches = lsGet(LS_SEARCHES), hist = lsGet(LS_HIST);
        let h = '';
        h += `<div class="drawer-sec"><span class="drawer-sec-h">${t('saved_cars_h')} · ${cars.length}</span>${cars.length ? `<button class="drawer-clear" onclick="clearSavedCars()">${t('clear_all')}</button>` : ''}</div>`;
        h += cars.length ? cars.map(c => `
            <div class="saved-row">
              <div class="grow flex items-center gap-3" data-key="${escapeHtml(c.key)}" data-act="open">
                <img src="${escapeHtml(c.thumb || '')}" alt="" onerror="this.style.visibility='hidden'">
                <div class="min-w-0"><div class="saved-row-title">${escapeHtml(c.title || c.key)}</div>${c.price ? `<div class="saved-row-price">${Number(c.price).toLocaleString()} ${escapeHtml(c.currency || '')}</div>` : ''}</div>
              </div>
              <button class="row-x" data-key="${escapeHtml(c.key)}" data-act="remove">✕</button>
            </div>`).join('') : `<div class="drawer-empty">${t('no_saved')}</div>`;

        h += `<div class="drawer-sec"><span class="drawer-sec-h">${t('saved_searches_h')} · ${searches.length}</span>${searches.length ? `<button class="drawer-clear" onclick="clearSavedSearches()">${t('clear_all')}</button>` : ''}</div>`;
        h += searches.length ? searches.map((s, i) => `<span class="chip-wrap"><button class="hist-chip" data-i="${i}" data-kind="search">♥ ${escapeHtml(s.label)}</button><button class="chip-del" data-i="${i}" data-kind="search" aria-label="delete">✕</button></span>`).join('') : `<div class="drawer-empty">—</div>`;

        h += `<div class="drawer-sec"><span class="drawer-sec-h">${t('recent_h')}</span>${hist.length ? `<button class="drawer-clear" onclick="clearHistory()">${t('clear_all')}</button>` : ''}</div>`;
        h += hist.length ? hist.map((q, i) => `<span class="chip-wrap"><button class="hist-chip" data-i="${i}" data-kind="hist">${escapeHtml(q)}</button><button class="chip-del" data-i="${i}" data-kind="hist" aria-label="delete">✕</button></span>`).join('') : `<div class="drawer-empty">—</div>`;

        const viewed = lsGet(LS_VIEWED);
        h += `<div class="drawer-sec"><span class="drawer-sec-h">${t('viewed_h')} · ${viewed.length}</span>${viewed.length ? `<button class="drawer-clear" onclick="clearViewed()">${t('clear_all')}</button>` : ''}</div>`;
        h += viewed.length ? viewed.map(c => `
            <div class="saved-row">
              <div class="grow flex items-center gap-3" data-key="${escapeHtml(c.key)}" data-act="open">
                <img src="${escapeHtml(c.thumb || '')}" alt="" onerror="this.style.visibility='hidden'">
                <div class="min-w-0"><div class="saved-row-title">${escapeHtml(c.title || c.key)}</div>${c.price ? `<div class="saved-row-price">${Number(c.price).toLocaleString()} ${escapeHtml(c.currency || '')}</div>` : ''}</div>
              </div>
            </div>`).join('') : `<div class="drawer-empty">—</div>`;

        const body = document.getElementById('saved-body');
        body.innerHTML = h;
        body.querySelectorAll('[data-act="open"]').forEach(el => el.onclick = (e) => { goToCarDetail(el.dataset.key, e); closeSaved(); });
        body.querySelectorAll('[data-act="remove"]').forEach(el => el.onclick = () => { toggleSave(el.dataset.key); renderSaved(); });
        body.querySelectorAll('.hist-chip').forEach(b => {
            b.onclick = () => {
                if (b.dataset.kind === 'search') { const s = lsGet(LS_SEARCHES)[+b.dataset.i]; if (s) runSavedSearch(s); }
                else { const q = lsGet(LS_HIST)[+b.dataset.i]; if (q) runHistory(q); }
            };
        });
        body.querySelectorAll('.chip-del').forEach((b) => {
            b.onclick = (e) => {
                e.stopPropagation();
                const lk = b.dataset.kind === 'search' ? LS_SEARCHES : LS_HIST;
                const a = lsGet(lk); a.splice(+b.dataset.i, 1); lsSet(lk, a);
                updateSavedCount(); renderSaved(); renderRecent();
            };
        });
    }

    window.clearSearchInput = function () {
        const el = document.getElementById('search-input');
        el.value = ''; el.focus();
        document.getElementById('clear-search').classList.add('hidden');
    };

    (function wireExtras() {
        const el = document.getElementById('search-input'), x = document.getElementById('clear-search');
        if (el && x) { const tog = () => x.classList.toggle('hidden', !el.value); el.addEventListener('input', tog); tog(); }
        updateSavedCount();
        renderRecent();
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSaved(); });
    })();

    window.addEventListener('popstate', () => {
        const route = parseRoute();
        if (route.view === 'detail') { showDetailView(route.key); window.scrollTo(0, 0); }
        else if (route.view === 'notfound') showNotFound();
        else { showSearchView(); requestAnimationFrame(() => window.scrollTo(0, _searchScrollY)); }
    });

    (function bootRoute() {
        const route = parseRoute();
        if (route.view === 'detail') showDetailView(route.key);
        else if (route.view === 'notfound') showNotFound();
    })();

    /* ===== custom rounded dropdowns — native <select> popups can't be styled ===== */
    // panel-ს ღილაკთან ათავსებს; თუ ქვემოთ ადგილი არ არის — ზემოთ გადააბრუნებს
    function _placeCddPanel(btn, panel) {
        const r = btn.getBoundingClientRect();
        // size to content (at least the button width), capped to the viewport
        panel.style.width = 'auto';
        panel.style.minWidth = r.width + 'px';
        panel.style.maxWidth = Math.min(380, window.innerWidth - 16) + 'px';
        const pw = Math.min(panel.offsetWidth || r.width, window.innerWidth - 16);
        let left = r.left;
        if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;   // clamp right edge
        if (left < 8) left = 8;
        panel.style.left = left + 'px';
        const below = window.innerHeight - r.bottom - 10;
        const above = r.top - 10;
        const ph = Math.min(300, panel.scrollHeight || 300);
        if (below >= ph || below >= above) {
            panel.style.top = (r.bottom + 6) + 'px';
            panel.style.bottom = 'auto';
            panel.style.maxHeight = Math.max(120, Math.min(300, below)) + 'px';
        } else {
            panel.style.top = 'auto';
            panel.style.bottom = (window.innerHeight - r.top + 6) + 'px';
            panel.style.maxHeight = Math.max(120, Math.min(300, above)) + 'px';
        }
    }

    function enhanceDropdowns() {
        document.querySelectorAll('select.filter-select').forEach(enhanceSelect);
        const closeAll = () => document.querySelectorAll('.cdd.open').forEach(d => {
            d.classList.remove('open');
            const b = d.querySelector('.cdd-btn'); if (b) { b.setAttribute('aria-expanded', 'false'); b.removeAttribute('aria-activedescendant'); }
        });
        document.addEventListener('click', closeAll);
        window.addEventListener('resize', closeAll);
        window.addEventListener('scroll', () => {
            const open = document.querySelector('.cdd.open');
            if (!open) return;
            const btn = open.querySelector('.cdd-btn'), panel = open.querySelector('.cdd-panel');
            const r = btn.getBoundingClientRect();
            if (r.bottom < 4 || r.top > window.innerHeight - 4) { open.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); return; }
            _placeCddPanel(btn, panel);
        }, true);
    }

    function enhanceSelect(sel) {
        if (sel._cdd) return;
        const multi = sel.multiple;
        const searchable = sel.dataset.search != null;
        let _filter = '';
        const _expanded = new Set();   // collapsed-by-default series groups (by header index)
        const wrap = document.createElement('div');
        wrap.className = 'cdd';
        sel.parentNode.insertBefore(wrap, sel);
        wrap.appendChild(sel);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cdd-btn';
        const panel = document.createElement('div');
        panel.className = 'cdd-panel';
        wrap.append(btn, panel);

        const _uid = 'cdd' + (enhanceSelect._n = (enhanceSelect._n || 0) + 1);
        const listId = _uid + '-list';
        btn.id = _uid + '-btn';
        btn.setAttribute('role', 'combobox');
        btn.setAttribute('aria-haspopup', 'listbox');
        btn.setAttribute('aria-expanded', 'false');
        btn.setAttribute('aria-controls', listId);
        const _lbl = (sel.closest('.filter-group') || wrap.parentNode || document).querySelector('.filter-label');
        if (_lbl) { if (!_lbl.id) _lbl.id = _uid + '-lbl'; btn.setAttribute('aria-labelledby', _lbl.id); }

        const realSel = () => Array.from(sel.selectedOptions).filter(o => o.value);
        const anyLabel = () => { const a = Array.from(sel.options).find(o => !o.value); return a ? a.textContent : ''; };

        const updateLabel = () => {
            if (multi) {
                const s = realSel();
                if (!s.length) { btn.innerHTML = `<span class="cdd-label is-empty">${escapeHtml(anyLabel())}</span><span class="cdd-chev">▾</span>`; return; }
                const MAX = 2;
                const chips = s.slice(0, MAX).map(o => `<span class="cdd-chip">${escapeHtml(o.textContent)}</span>`).join('');
                const more = s.length > MAX ? `<span class="cdd-count">+${s.length - MAX}</span>` : '';
                btn.innerHTML = `<span class="cdd-chips">${chips}</span>${more}<span class="cdd-chev">▾</span>`;
            } else {
                const cur = sel.options[sel.selectedIndex];
                btn.innerHTML = `<span class="cdd-label">${escapeHtml(cur ? cur.textContent : '')}</span><span class="cdd-chev">▾</span>`;
            }
        };

        const rowsHtml = () => {
            let group = null;   // index of the current series header (or null = ungrouped)
            return Array.from(sel.options).map((o, i) => {
                if (o.disabled) {
                    if (multi && searchable && _filter) return '';   // hide headers while searching
                    if (o.textContent) {
                        group = i;
                        return `<div class="cdd-group-head cdd-grp ${_expanded.has(i) ? 'open' : ''}" id="${listId}-o${i}" role="option" aria-selected="false" aria-expanded="${_expanded.has(i) ? 'true' : 'false'}" data-group="${i}"><span class="grp-chev">▸</span>${escapeHtml(o.textContent)}</div>`;
                    }
                    group = null;
                    return `<div class="cdd-sep" role="presentation"></div>`;
                }
                if (multi) {
                    const collapsed = group !== null && !_expanded.has(group) && !(searchable && _filter);
                    if (collapsed) return '';
                    if (searchable && _filter && o.value && !o.textContent.toLowerCase().includes(_filter)) return '';
                    const badge = (sel.id === 'f-brand' && o.value) ? _brandBadge(o.textContent) : '';
                    return `<div class="cdd-opt cdd-check ${o.selected ? 'on' : ''}" id="${listId}-o${i}" role="option" aria-selected="${o.selected ? 'true' : 'false'}" data-i="${i}"><span class="cdd-box">${o.selected ? '✓' : ''}</span>${badge}${escapeHtml(o.textContent)}</div>`;
                }
                return `<div class="cdd-opt ${i === sel.selectedIndex ? 'on' : ''}" id="${listId}-o${i}" role="option" aria-selected="${i === sel.selectedIndex ? 'true' : 'false'}" data-i="${i}">${escapeHtml(o.textContent)}</div>`;
            }).join('');
        };

        const render = () => {
            wrap.classList.toggle('disabled', sel.disabled);
            updateLabel();
            const _ph = escapeHtml(t(sel.dataset.searchPh || ''));
            const sb = (multi && searchable)
                ? `<input class="cdd-search" type="text" aria-controls="${listId}" aria-autocomplete="list" aria-label="${_ph}" placeholder="${_ph}" value="${escapeHtml(_filter)}">`
                : '';
            panel.innerHTML = sb + `<div class="cdd-rows" id="${listId}" role="listbox"${multi ? ' aria-multiselectable="true"' : ''}>${rowsHtml()}</div>`;
            if (multi && searchable) {
                const si = panel.querySelector('.cdd-search');
                si.addEventListener('click', (e) => e.stopPropagation());
                si.addEventListener('input', () => { _filter = si.value.trim().toLowerCase(); panel.querySelector('.cdd-rows').innerHTML = rowsHtml(); if (wrap.classList.contains('open')) setActive(0); });
            }
        };

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (sel.disabled) return;
            wrap.classList.contains('open') ? closePanel(false) : openPanel('first');
        });
        panel.addEventListener('click', (e) => {
            const grp = e.target.closest('.cdd-grp');
            if (grp) {
                e.stopPropagation();
                const gi = +grp.dataset.group;
                _expanded.has(gi) ? _expanded.delete(gi) : _expanded.add(gi);
                const rowsEl = panel.querySelector('.cdd-rows'); if (rowsEl) rowsEl.innerHTML = rowsHtml();
                return;
            }
            const opt = e.target.closest('.cdd-opt');
            if (!opt) return;
            if (multi) e.stopPropagation();   // keep panel open for multi-select
            const i = +opt.dataset.i;
            if (multi) {
                const o = sel.options[i];
                if (!o.value) { Array.from(sel.options).forEach(x => x.selected = false); }
                else { o.selected = !o.selected; const any = Array.from(sel.options).find(x => !x.value); if (any) any.selected = false; }
                sel.dispatchEvent(new Event('change', { bubbles: true }));
                const rowsEl = panel.querySelector('.cdd-rows'); if (rowsEl) rowsEl.innerHTML = rowsHtml();
                updateLabel();
            } else {
                sel.selectedIndex = i;
                sel.dispatchEvent(new Event('change', { bubbles: true }));
                closePanel(false);
                render();
            }
        });

        // ── keyboard support (APG combobox/listbox) ──────────────────────
        let _activeIdx = -1;
        const focusOwner = () => (multi && searchable) ? panel.querySelector('.cdd-search') : btn;
        const rowEls = () => Array.from(panel.querySelectorAll('.cdd-rows > .cdd-opt, .cdd-rows > .cdd-grp'));
        const setActive = (idx) => {
            const rows = rowEls();
            if (!rows.length) { _activeIdx = -1; const fo = focusOwner(); if (fo) fo.removeAttribute('aria-activedescendant'); return; }
            _activeIdx = Math.max(0, Math.min(idx, rows.length - 1));
            rows.forEach(r => r.classList.remove('cdd-active'));
            const el = rows[_activeIdx];
            el.classList.add('cdd-active');
            const fo = focusOwner(); if (fo) fo.setAttribute('aria-activedescendant', el.id);
            el.scrollIntoView({ block: 'nearest' });
        };
        const openPanel = (at) => {
            if (sel.disabled) return;
            document.querySelectorAll('.cdd.open').forEach(d => { d.classList.remove('open'); const b = d.querySelector('.cdd-btn'); if (b) b.setAttribute('aria-expanded', 'false'); });
            _filter = ''; render(); wrap.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
            _placeCddPanel(btn, panel); panel.scrollTop = 0;
            const fo = focusOwner(); if (fo && fo !== btn) fo.focus();
            setActive(at === 'last' ? rowEls().length - 1 : 0);
        };
        const closePanel = (focusBtn) => {
            wrap.classList.remove('open'); btn.setAttribute('aria-expanded', 'false');
            const fo = focusOwner(); if (fo) fo.removeAttribute('aria-activedescendant');
            _activeIdx = -1;
            if (focusBtn) btn.focus();
        };
        const activateRow = () => {
            const rows = rowEls(); const el = rows[_activeIdx]; if (!el) return;
            if (el.classList.contains('cdd-grp')) {
                const gi = +el.dataset.group;
                _expanded.has(gi) ? _expanded.delete(gi) : _expanded.add(gi);
                const rowsEl = panel.querySelector('.cdd-rows'); if (rowsEl) rowsEl.innerHTML = rowsHtml();
                const same = panel.querySelector(`[data-group="${gi}"]`);
                const ni = rowEls().indexOf(same);
                setActive(ni >= 0 ? ni : 0);
            } else if (multi) {
                el.click();
                setActive(_activeIdx);   // rows re-render on multi-select; re-anchor highlight
            } else {
                el.click();              // single-select click closes the panel
            }
        };
        const onKey = (e) => {
            if (sel.disabled) return;
            if (!wrap.classList.contains('open')) {
                if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel('first'); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); openPanel('last'); }
                return;
            }
            switch (e.key) {
                case 'ArrowDown': e.preventDefault(); setActive(_activeIdx + 1); break;
                case 'ArrowUp':   e.preventDefault(); setActive(_activeIdx - 1); break;
                case 'Home':      e.preventDefault(); setActive(0); break;
                case 'End':       e.preventDefault(); setActive(rowEls().length - 1); break;
                case 'Enter':     e.preventDefault(); activateRow(); break;
                case ' ':
                    if (e.target.classList && e.target.classList.contains('cdd-search')) return;  // let space type
                    e.preventDefault(); activateRow(); break;
                case 'Escape':    e.preventDefault(); closePanel(true); break;
                case 'Tab':       closePanel(false); break;
            }
        };
        wrap.addEventListener('keydown', onKey);
        sel.addEventListener('change', () => { wrap.classList.contains('open') ? updateLabel() : render(); });
        new MutationObserver((muts) => { if (muts.some(m => m.type === 'childList')) _expanded.clear(); render(); }).observe(sel, { childList: true, attributes: true, attributeFilter: ['disabled'] });
        sel._cdd = { render };
        render();
    }

    function refreshDropdowns() {
        document.querySelectorAll('select.filter-select').forEach(s => s._cdd && s._cdd.render());
    }

    // small icon next to each sidebar filter label (injected as an absolute
    // sibling so language switches, which rewrite the label text, leave it intact)
    const _FILTER_ICONS = {
        brand:    '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-6.2-6.2a2 2 0 0 1-.6-1.4V5a1 1 0 0 1 1-1h7a2 2 0 0 1 1.4.6l6.4 6.4a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.4"/>',
        model:    '<path d="M5 11l1.5-4.2A2 2 0 0 1 8.4 5.5h7.2a2 2 0 0 1 1.9 1.3L19 11M4.5 11h15v3.5a1 1 0 0 1-1 1H17a1 1 0 0 1-1-1v-.5H8v.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="13" r="1"/><circle cx="16.5" cy="13" r="1"/>',
        year:     '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/>',
        price:    '<circle cx="12" cy="12" r="9"/><path d="M14.5 9.3A2.4 2.4 0 0 0 12 8c-1.4 0-2.5.9-2.5 2s1.1 1.9 2.5 1.9 2.5.9 2.5 2-1.1 2-2.5 2a2.4 2.4 0 0 1-2.5-1.4M12 6.5v11"/>',
        mileage:  '<path d="M13.4 13.4l2.6-2.6"/><path d="M3.6 15a9 9 0 1 1 16.8 0"/>',
        body_type:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
        fuel:     '<path d="M6 21V5.5A2.5 2.5 0 0 1 8.5 3h3A2.5 2.5 0 0 1 14 5.5V21"/><path d="M4 21h12M8 8h4"/><path d="M14 9l2.4 2.4c.4.4.6.9.6 1.4V17a1.5 1.5 0 0 0 3 0V9.5"/>',
        gearbox:  '<circle cx="6" cy="5" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="18" cy="5" r="1.5"/><path d="M6 6.5v4h12v-4M12 10.5v8.5M10 19h4"/>',
        drive:    '<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',
        location: '<path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
        customs:  '<path d="M12 3l7 3v5c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
    };
    function addFilterIcons() {
        document.querySelectorAll('.sidebar .filter-group[data-filter]').forEach(g => {
            if (g.querySelector(':scope > .fl-icon')) return;
            const paths = _FILTER_ICONS[g.dataset.filter];
            if (!paths) return;
            const span = document.createElement('span');
            span.className = 'fl-icon';
            span.setAttribute('aria-hidden', 'true');
            span.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
            g.insertBefore(span, g.firstChild);
        });
    }

    loadStats();
    loadMakes();
    loadFacets();
    enhanceDropdowns();
    initMileageSlider();
    updateSearchBtnCount();
    renderCompareBar();
    addFilterIcons();

    // dropdowns are enhanced before translations are applied (DOMContentLoaded),
    // so re-render once labels exist — otherwise the sort button shows blank until clicked
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refreshDropdowns);
    else refreshDropdowns();

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            const m = document.getElementById('cmp-modal');
            if (m && m.classList.contains('show')) closeCompare();
        }
    });
</script>

</body>
</html>
