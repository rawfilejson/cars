<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carba — VIN / phone / free-text car search</title>
    <meta name="description" content="Aggregated car listings from autopapa.ge and myauto.ge. Free, no signup.">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="i18n.js"></script>

    <!-- Cloudflare Web Analytics — privacy-first, no cookies, free.
         To enable: Cloudflare dashboard → Web Analytics → Add a site,
         then paste your token into web/config.js as window.CF_ANALYTICS_TOKEN. -->
    <script>
        if (window.CF_ANALYTICS_TOKEN) {
            const s = document.createElement('script');
            s.defer = true;
            s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
            s.dataset.cfBeacon = JSON.stringify({ token: window.CF_ANALYTICS_TOKEN });
            document.head.appendChild(s);
        }
    </script>

    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #1e293b, #0f172a); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="gradient-bg text-white py-5 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 flex items-center justify-between gap-4">
        <h1 class="text-xl md:text-2xl font-bold tracking-wide flex items-center gap-2">
            <span class="text-blue-400">●</span> Carba
        </h1>
        <div class="flex items-center gap-4 text-sm">
            <div id="stats-line" class="text-slate-300 hidden">
                <span id="nav-listings-count">—</span>
            </div>
            <div class="flex gap-1 border-l border-slate-600 pl-4">
                <button class="lang-btn px-2 py-1 hover:text-white" data-lang="ka">KA</button>
                <span class="text-slate-600">/</span>
                <button class="lang-btn px-2 py-1 hover:text-white" data-lang="en">EN</button>
            </div>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-10">

    <div class="text-center mb-6">
        <h2 class="text-3xl md:text-4xl font-bold text-slate-800 mb-3" data-i18n="hero_title"></h2>
        <p class="text-slate-600 max-w-2xl mx-auto" data-i18n-html="hero_desc_html"></p>
    </div>

    <div class="max-w-2xl mx-auto mb-4 px-4 py-3 bg-amber-50 border-l-4 border-amber-400 rounded text-sm text-amber-900"
         data-i18n-html="notice_date_html"></div>

    <div id="notice-slow"
         class="max-w-2xl mx-auto mb-10 px-4 py-3 bg-slate-100 border-l-4 border-slate-400 rounded text-sm text-slate-700 hidden"
         data-i18n-html="notice_slow_html"></div>

    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <div class="flex gap-2 mb-4 flex-wrap">
            <button class="search-tab px-4 py-2 bg-blue-500 text-white rounded" data-tab="vin" data-i18n="tab_vin"></button>
            <button class="search-tab px-4 py-2 bg-slate-200 rounded" data-tab="phone" data-i18n="tab_phone"></button>
            <button class="search-tab px-4 py-2 bg-slate-200 rounded" data-tab="free_text" data-i18n="tab_text"></button>
        </div>

        <div class="flex gap-2">
            <input id="search-input" type="text"
                   data-i18n-placeholder="ph_vin"
                   class="flex-1 px-4 py-3 border border-slate-300 rounded focus:border-blue-500 focus:outline-none">
            <button id="btn-search"
                    class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded font-semibold disabled:bg-slate-400"
                    data-i18n="btn_search"></button>
        </div>

        <p id="search-meta" class="mt-3 text-sm text-slate-500"></p>
    </div>

    <div id="results"></div>

    <div id="empty-state" class="text-center py-16 text-slate-400" data-i18n="empty_state"></div>

</main>

<footer class="mt-20 py-8 text-center text-sm text-slate-500 border-t">
    <p data-i18n="footer_about"></p>
    <p class="mt-2">
        <span data-i18n="footer_contact"></span>
        <a href="https://instagram.com/deme.brn" target="_blank" rel="noopener"
           class="font-semibold underline hover:text-blue-700">@deme.brn</a>
    </p>
</footer>

<script>
    const API_BASE = window.API_BASE || 'http://127.0.0.1:8765';
    let currentTab = 'vin';
    let lastResponse = null;

    async function loadStats() {
        try {
            const resp = await fetch(`${API_BASE}/stats`);
            if (!resp.ok) return;
            const data = await resp.json();
            const n = data.total_cars.toLocaleString();
            document.getElementById('nav-listings-count').textContent = t('nav_listings_count', { n });
            document.getElementById('stats-line').classList.remove('hidden');
        } catch (e) { /* silent */ }
    }

    function updateTabPlaceholder() {
        const key = { vin: 'ph_vin', phone: 'ph_phone', free_text: 'ph_text' }[currentTab];
        document.getElementById('search-input').placeholder = t(key);
        // Show the "search may be slow" notice only on free-text tab
        const notice = document.getElementById('notice-slow');
        notice.classList.toggle('hidden', currentTab !== 'free_text');
    }

    document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.onclick = () => setLang(btn.dataset.lang);
    });

    document.addEventListener('langchange', () => {
        loadStats();
        updateTabPlaceholder();
        if (lastResponse) renderResults(lastResponse);
    });

    document.querySelectorAll('.search-tab').forEach((btn) => {
        btn.onclick = () => {
            document.querySelectorAll('.search-tab').forEach((b) => {
                b.classList.remove('bg-blue-500', 'text-white');
                b.classList.add('bg-slate-200');
            });
            btn.classList.add('bg-blue-500', 'text-white');
            btn.classList.remove('bg-slate-200');
            currentTab = btn.dataset.tab;
            updateTabPlaceholder();
        };
    });

    // Reject obviously too-broad free-text queries client-side. Server has
    // the same check — this just avoids the round-trip.
    function isTooGeneric(text) {
        const trimmed = text.trim();
        if (trimmed.length < 5) return true;
        const words = trimmed.split(/\s+/).filter(Boolean);
        const hasDigit = /\d/.test(trimmed);
        // Single word with no digit and < 8 chars → too vague (e.g. "Toyota")
        if (words.length === 1 && !hasDigit && trimmed.length < 8) return true;
        return false;
    }

    async function doSearch() {
        const value = document.getElementById('search-input').value.trim();
        if (!value) return;

        const btn = document.getElementById('btn-search');
        const meta = document.getElementById('search-meta');
        const results = document.getElementById('results');
        const empty = document.getElementById('empty-state');

        if (currentTab === 'free_text' && isTooGeneric(value)) {
            meta.innerHTML = `<span class="text-orange-600">${t('err_too_generic')}</span>`;
            results.innerHTML = '';
            empty.classList.add('hidden');
            return;
        }

        btn.disabled = true;
        btn.textContent = t('btn_searching');
        meta.textContent = '';
        empty.classList.add('hidden');

        try {
            const resp = await fetch(`${API_BASE}/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ [currentTab]: value }),
            });

            if (!resp.ok) {
                const err = await resp.json();
                const color = resp.status === 429 ? 'text-orange-600' : 'text-red-600';
                meta.innerHTML = `<span class="${color}">${err.detail}</span>`;
                results.innerHTML = '';
                lastResponse = null;
                return;
            }

            lastResponse = await resp.json();
            renderResults(lastResponse);
        } catch (e) {
            meta.innerHTML = `<span class="text-red-600">${t('err_fetch', { msg: e.message })}</span>`;
        } finally {
            btn.disabled = false;
            btn.textContent = t('btn_search');
        }
    }

    document.getElementById('btn-search').onclick = doSearch;
    document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doSearch();
    });

    function renderResults(data) {
        const meta = document.getElementById('search-meta');
        const results = document.getElementById('results');

        let metaText = `<strong>${t('results_count', { n: data.results_count })}</strong>`;
        if (data.remaining_free_searches !== null && data.remaining_free_searches !== undefined) {
            metaText += t('results_remaining', { n: data.remaining_free_searches });
        }
        meta.innerHTML = metaText;

        if (data.results.length === 0) {
            results.innerHTML = `<div class="text-center py-10 text-slate-500">${t('no_results')}</div>`;
            return;
        }

        const sourceBadge = (src) => {
            const colors = {
                autopapa: 'bg-orange-100 text-orange-700 border-orange-300',
                myauto:   'bg-blue-100 text-blue-700 border-blue-300',
            };
            const cls = colors[src] || 'bg-slate-100 text-slate-700 border-slate-300';
            return `<span class="text-[10px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded border ${cls}">${escapeHtml(src)}</span>`;
        };

        const cleared = t('cleared');
        const notCleared = t('not_cleared');

        results.innerHTML = data.results.map((car) => `
            <div class="bg-white rounded-lg shadow-md mb-4 overflow-hidden hover:shadow-lg transition relative">
                <div class="absolute top-2 right-2 z-10">${sourceBadge(car.source)}</div>
                <div class="flex flex-col md:flex-row">
                    <div class="md:w-64 flex-shrink-0">
                        ${car.image_urls && car.image_urls.length > 0
                            ? `<img src="${car.image_urls[0]}" class="w-full h-48 object-cover" onerror="this.style.display='none'">`
                            : `<div class="w-full h-48 bg-slate-200 flex items-center justify-center text-slate-400">📷</div>`}
                    </div>
                    <div class="p-4 flex-1">
                        <div class="flex items-start justify-between">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800">
                                    ${escapeHtml(car.manufacturer)} ${escapeHtml(car.model)} ${car.year || ''}
                                </h3>
                                <p class="text-sm text-slate-500">${escapeHtml(car.location || '')}</p>
                            </div>
                            <div class="text-right mr-20">
                                <p class="font-bold text-lg text-green-600">
                                    ${car.price_amount ? car.price_amount.toLocaleString() : '—'} ${car.price_currency || ''}
                                </p>
                                <p class="text-xs text-slate-500">${car.customs_cleared === true ? cleared : car.customs_cleared === false ? notCleared : ''}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-3 text-sm text-slate-600">
                            ${car.mileage_km ? `<div>📊 ${car.mileage_km.toLocaleString()} km</div>` : ''}
                            ${car.engine_volume_l ? `<div>⚙️ ${car.engine_volume_l}L</div>` : ''}
                            ${car.engine_type ? `<div>⛽ ${escapeHtml(car.engine_type)}</div>` : ''}
                            ${car.gearbox ? `<div>🔧 ${escapeHtml(car.gearbox)}</div>` : ''}
                        </div>
                        ${car.vin ? `
                            <div class="mt-3 p-2 bg-blue-50 rounded text-sm">
                                <strong>VIN:</strong> <code class="font-mono">${escapeHtml(car.vin)}</code>
                            </div>` : ''}
                        ${car.phone ? `
                            <div class="mt-2 text-sm">
                                <strong>📞</strong> <a href="tel:${escapeHtml(car.phone)}" class="text-blue-600">${escapeHtml(car.phone)}</a>
                                ${car.seller_name ? ` · ${escapeHtml(car.seller_name)}` : ''}
                            </div>` : ''}
                        <div class="mt-3 flex gap-2">
                            <a href="${car.url}" target="_blank" rel="noopener"
                               class="text-sm text-blue-600 hover:underline">${t('view_source')}</a>
                            ${car.image_urls && car.image_urls.length > 1
                                ? `<span class="text-sm text-slate-400">${t('more_photos', { n: car.image_urls.length - 1 })}</span>`
                                : ''}
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadStats();
    updateTabPlaceholder();
</script>

</body>
</html>
